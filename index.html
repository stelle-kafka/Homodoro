<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#20201F">
<title>Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #20201F;
    --fg: #ffffff;
    --fg-dim: #6b6b6b;
    --fg-faint: #2c2c2c;
    --btn-border: rgba(255,255,255,0.7);
    --track: #141414;
    --accent-a: #ffffff;   /* primary phase — work / longer altloop segment */
    --accent-b: #575757;   /* secondary phase — break / shorter altloop segment */
    --hairline: #1d1d1d;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', monospace;
    -webkit-font-smoothing: antialiased;
    color-scheme: dark;
    overflow: hidden;
  }

  html.modal-locked, html.modal-locked body{
    overflow: hidden !important;
  }

  /* ---------- app-level paging: Timer <-> Calculator ---------- */

  .app-viewport{
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }

  .app-track{
    display:flex;
    width: 200%;
    height: 100%;
  }

  .app-page{
    width: 50%;
    height: 100%;
    flex-shrink: 0;
    overflow-y: hidden;
    overflow-x: hidden;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: touch;
    display:flex;
    align-items:flex-start;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }

  .app-page[data-page="1"]{
    align-items: stretch;
    justify-content: flex-start;
    padding: 0;
    overflow-y: hidden;
  }

  .stage{
    width: 100%;
    max-width: 400px;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: clamp(24px, 5vh, 52px);
  }

  /* ---------- dial ---------- */

  .dial-viewport{
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    height: min(76vw, 55dvh, 296px);
    overflow: hidden;
    position: relative;
    touch-action: none;
    flex-shrink: 0;
  }

  .dial-track{
    display:flex;
    height:100%;
    width:300%;
  }

  .dial-page{
    position: relative;
    width:33.3334%;
    height:100%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-mask-image: linear-gradient(to right,
      transparent 0%, #000 9%, #000 91%, transparent 100%);
    mask-image: linear-gradient(to right,
      transparent 0%, #000 9%, #000 91%, transparent 100%);
  }

  .dial-inner{
    position: relative;
    width: min(68vw, 50dvh, 266px);
    height: min(68vw, 50dvh, 266px);
  }

  svg.dial{ width:100%; height:100%; transform: rotate(-90deg); display:block; }
  .ring-track{
    fill:none;
    stroke: var(--track);
    stroke-width: 1.1;
  }
  .ring-progress{
    fill:none;
    stroke-width: 1.1;
    stroke-linecap: round;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  .ring-progress.work{ stroke: var(--accent-a); }
  .ring-progress.break{ stroke: var(--accent-b); }

  @keyframes ringFlashPulse{
    0%   { transform: scale(1); filter: drop-shadow(0 0 0px rgba(255,255,255,0)); }
    35%  { transform: scale(1.035); filter: drop-shadow(0 0 5px rgba(255,255,255,0.85)) drop-shadow(0 0 11px rgba(255,255,255,0.35)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(255,255,255,0)); }
  }
  .ring-progress.phase-flash{
    animation: ringFlashPulse 0.5s cubic-bezier(.22,1,.36,1);
  }

  .dial-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 8px;
    pointer-events:none;
  }

  .custom-tag{
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translate(-50%, -8px);
    white-space: nowrap;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  .time{
    position: relative;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    font-size: clamp(40px, 11vw, 60px);
    letter-spacing: 0.01em;
    color: var(--fg);
    line-height: 1;
  }

  .phase-label{
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  .time{
    position: relative;
    display:flex;
    align-items:baseline;
    justify-content:center;
    pointer-events: none;
  }

  .time-unit{
    position: relative;
    display:inline-block;
    pointer-events: auto;
    cursor: ns-resize;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    border-radius: 10px;
    transition: transform .1s ease, color .18s ease;
    will-change: transform;
  }

  .time-unit.dragging{ transition: none; color: var(--fg); }
  .time-unit.releasing{ transition: transform .48s cubic-bezier(.34, 1.56, .64, 1); }

  .time-colon{
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    align-self: stretch;
    gap: clamp(5px, 1.3vw, 8px);
    padding: 0 3px;
    pointer-events: none;
    font-size: 0;
    color: transparent;
  }
  .time-colon::before,
  .time-colon::after{
    content: '';
    display: block;
    width: clamp(3px, 0.9vw, 5px);
    height: clamp(3px, 0.9vw, 5px);
    border-radius: 50%;
    background: var(--fg);
  }
  #time0 .time-colon{ pointer-events: auto; cursor: pointer; -webkit-touch-callout: none; }

  /* ---------- preset tabs (also reused by calculator mode switch) ---------- */

  .preset-tabs{
    position: relative;
    display:flex;
    width: 100%;
    max-width: 260px;
    border-bottom: 1px solid var(--bg);
    flex-shrink: 0;
  }

  .tab{
    flex: 1;
    background: none;
    border: none;
    color: var(--fg-dim);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    font-weight: 400;
    padding: 0 0 12px;
    cursor: pointer;
    transition: color .25s ease;
  }
  .tab.active{ color: var(--fg); font-weight: 500; }

  .tab-indicator{
    position:absolute;
    bottom: -1px;
    height: 1px;
    background: var(--fg);
    width: 33.3334%;
    left: 0;
    transition: transform .3s cubic-bezier(.22,1,.36,1);
  }

  /* ---------- controls ---------- */

  .controls{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: clamp(12px, 2.5vh, 18px);
    flex-shrink: 0;
  }

  .dial-btn{
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: border-color .2s ease, background .2s ease, opacity .08s ease;
  }
  .dial-btn:hover{ border-color: var(--fg); }
  .dial-btn:active{ opacity: 0.6; }
  .dial-btn:focus-visible{ outline: 1px solid var(--fg-dim); outline-offset: 4px; }
  .dial-btn.running{ background: var(--fg); border-color: var(--fg); }
  .dial-btn svg{ width: 19px; height: 19px; display:block; overflow: visible; }
  .dial-btn svg.icon-play{ fill:none; stroke: var(--fg); stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
  .dial-btn svg.icon-pause{ fill: #000; }

  /* ---------- hidden gesture: start/pause <-> settings ---------- */

  /* translate / scale are the individual transform properties so the button
     can be moved by script (translate) and shrunk (scale) independently. */
  #startPauseBtn{
    transition: border-color .2s ease, background .2s ease, opacity .08s ease,
                scale .38s cubic-bezier(.34, 1.56, .64, 1);
  }
  #startPauseBtn.lifted{ position: relative; z-index: 6; }
  #startPauseBtn.gear-size{ scale: .72; }

  .dial-btn svg.icon-gear{
    width: 26px; height: 26px;      /* shown at ~19px once the button is scaled */
    fill: none; stroke: var(--fg); stroke-width: 1.3;
    stroke-linecap: round; stroke-linejoin: round;
    animation: gearPop .4s cubic-bezier(.22, 1, .36, 1);
  }
  @keyframes gearPop{
    from{ transform: rotate(-90deg) scale(.5); opacity: 0; }
    to  { transform: none; opacity: 1; }
  }

  .orbit{
    position: fixed;
    left: 0; top: 0;
    pointer-events: none;
    overflow: visible;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .orbit.on{ opacity: 1; }
  .orbit circle{ fill: none; stroke-width: 1.1; }
  .orbit-track{ stroke: rgba(255,255,255,0.14); stroke-dasharray: 2 5; transition: stroke .25s ease; }
  .orbit.done .orbit-track{ stroke: rgba(255,255,255,0.32); }
  .orbit-progress{
    stroke: var(--fg);
    stroke-linecap: round;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    transform: rotate(-90deg);
  }

  .reset-link{
    background:none;
    border:none;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--fg-dim);
    cursor: pointer;
    padding: 4px 8px;
    transition: color .2s ease, opacity .2s ease;
  }
  .reset-link:hover{ color: var(--fg); }
  .reset-link:active{ opacity: .55; }

  /* ---------- custom preset: settings modal ---------- */

  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 50;
    touch-action: none;
    overscroll-behavior: contain;
  }
  .modal-overlay[hidden]{ display:none; }

  .modal-panel{
    width:100%;
    max-width: 260px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: clamp(30px, 6vh, 46px);
  }

  .modal-title{
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--fg-dim);
    text-align:center;
  }

  .modal-field{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 9px;
  }

  .modal-value{
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    font-size: clamp(44px, 13vw, 56px);
    line-height: 1;
    color: var(--fg);
    cursor: ns-resize;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    border-radius: 10px;
    transition: transform .1s ease;
    will-change: transform;
  }
  .modal-value.dragging{ transition: none; }
  .modal-value.releasing{ transition: transform .48s cubic-bezier(.34, 1.56, .64, 1); }
  .modal-time{ display:flex; align-items:baseline; justify-content:center; gap: 2px; }
  .modal-time .modal-value{ padding: 0 4px; }
  .modal-colon{ font-weight:200; font-size: clamp(44px, 13vw, 56px); line-height:1; color: var(--fg-dim); }

  .modal-field-label{
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }

  .modal-actions{
    display:flex;
    gap: 32px;
    margin-top: 2px;
  }

  .modal-actions .reset-link{ padding: 6px 4px; }
  .modal-actions .modal-apply{ color: var(--fg); }
  .modal-actions .modal-apply:hover{ color: var(--fg); opacity: .7; }

  #historyModal .modal-panel{ max-width: 320px; }

  /* ---------- settings modal ---------- */

  #settingsModal{
    background: var(--bg);          /* shows the chosen colour live while picking */
    transition: background-color .25s ease;
    align-items: flex-start;
    overflow-y: auto;
    touch-action: pan-y;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  #settingsModal .modal-panel{ max-width: 300px; margin: auto 0; gap: 26px; }

  .set-list{ width:100%; display:flex; flex-direction:column; }
  .set-row{
    appearance:none; -webkit-appearance:none;
    background:none; border:0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    color: var(--fg);
    font: inherit;
    width:100%;
    min-height: 52px;
    padding: 0 2px;
    display:flex; align-items:center; justify-content:space-between;
    text-align:left;
    cursor:pointer;
    transition: opacity .2s ease;
  }
  .set-row:last-child{ border-bottom:0; }
  .set-row:focus-visible{ outline: 1px solid var(--fg-dim); outline-offset: -2px; }
  .set-row--static{ cursor: default; }
  .set-row.dim{ opacity: .35; }
  .set-label{
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--fg-dim);
  }
  .set-val{
    font-size: 15px; font-weight: 300;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }
  .set-val.off{ color: var(--fg-dim); }
  button.set-row:active .set-val{ opacity: .55; }
  .modal-value.set-value{ font-size: 22px; padding: 8px 4px; }

  .lofi-dock{
    position:absolute; left:0; right:0; bottom:max(6px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; pointer-events:none;
  }
  .lofi-dock > *{ pointer-events:auto; }
  .lofi-row{ position:relative; display:flex; justify-content:center; }
  .lofi-shuffle{
    position:absolute; left:calc(50% + 56px); top:2px;
    width:36px; height:36px; padding:0; background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  .lofi-shuffle svg{
    width:20px; height:20px; fill:none; stroke:var(--fg-dim); stroke-width:1.3;
    stroke-linecap:round; stroke-linejoin:round; opacity:.5; transition: stroke .3s ease, opacity .3s ease;
  }
  .lofi-shuffle.active svg{ stroke:var(--fg); opacity:1; }
  .lofi-empty{ padding:14px 2px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-dim); opacity:.6; }
  .lofi-vol{ width:min(calc(100% - 48px), 280px); transition: opacity .25s ease; }
  .lofi-vol.disabled{ opacity:.3; pointer-events:none; }
  input[type="range"].lofi-slider{
    --fill: 40%;
    -webkit-appearance:none; appearance:none;
    width:100%; height:36px; margin:0;
    background:transparent; border:0; outline:none; box-shadow:none; cursor:pointer;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;
  }
  input[type="range"].lofi-slider:focus,
  input[type="range"].lofi-slider:focus-visible{ outline:none; box-shadow:none; }
  input[type="range"].lofi-slider::-webkit-slider-runnable-track{
    height:1px; border-radius:1px;
    background: linear-gradient(to right, var(--fg) var(--fill), var(--fg-faint) var(--fill));
  }
  input[type="range"].lofi-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:36px; height:36px; margin-top:-17.5px; border-radius:50%; border:0; box-shadow:none; outline:none;
    background: radial-gradient(circle, var(--fg) 4px, rgba(255,255,255,0) 4.5px);
    cursor:pointer; transition: transform .15s ease;
  }
  input[type="range"].lofi-slider:active::-webkit-slider-thumb{ transform: scale(1.3); }
  input[type="range"].lofi-slider::-moz-range-thumb{
    width:36px; height:36px; border-radius:50%; border:none;
    background: radial-gradient(circle, var(--fg) 4px, rgba(255,255,255,0) 4.5px);
    cursor:pointer; transition: transform .15s ease;
  }
  input[type="range"].lofi-slider:active::-moz-range-thumb{ transform: scale(1.3); }
  input[type="range"].lofi-slider::-moz-range-track{
    height:1px; border-radius:1px;
    background: linear-gradient(to right, var(--fg) var(--fill), var(--fg-faint) var(--fill));
  }
  input[type="range"].lofi-slider::-moz-range-progress{ height:1px; background:var(--fg); }
  .lofi-list{ padding: 0 2px 8px; }
  .lofi-item{ display:flex; align-items:center; gap:10px; min-height:38px; font-size:13px; color:var(--fg); }
  .lofi-item span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lofi-item button{ background:none; border:0; color:var(--fg-dim); font:inherit; font-size:16px; padding:4px 8px; cursor:pointer; }
  .app-page[data-page="0"]{ position: relative; }
  .lofi-btn{
    background:none; border:none; padding:8px 14px 0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; touch-action:manipulation;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  .lofi-btn .wave{
    width:64px; height:24px; display:block; overflow:hidden;
  }
  .lofi-btn .wave path{
    fill:none; stroke:var(--fg-dim); stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round;
    opacity:.5; transition: stroke .3s ease, opacity .3s ease;
  }
  .lofi-btn.active .wave path{ stroke:var(--fg); opacity:1; }
  .lofi-btn-label{ font-size:10px; font-weight:500; letter-spacing:.3em; margin-right:-.3em; text-transform:uppercase; color:var(--fg-dim); transition: color .3s ease; }
  .lofi-btn.active .lofi-btn-label{ color:var(--fg); }
  .swatches{ display:flex; gap: 12px; }
  .swatch{
    width: 22px; height: 22px; border-radius: 50%;
    padding: 0; cursor: pointer;
    background: var(--c);
    border: 1px solid rgba(255,255,255,0.28);
  }
  .swatch.active{ outline: 1px solid var(--fg); outline-offset: 3px; }

  .preset-switch{ display:flex; gap: 22px; margin-top: -8px; }
  .preset-switch .reset-link{ padding: 6px 4px; }
  .preset-switch .reset-link.active{ color: var(--fg); }

  /* ---------- calculator page ---------- */

  .calc-stage{
    width: 100%;
    height: 100%;
    min-height: 100%;
    max-height: 100%;
    margin: 0;
    display:flex;
    flex-direction: column;
    gap: clamp(8px, 1.6vh, 14px);
    overflow: hidden;
  }

  .calc-header{
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: max(16px, env(safe-area-inset-top)) 18px 0;
  }

  .calc-header-right{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .calc-icon-btn{
    width: 34px;
    height: 34px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    color: var(--fg-dim);
    cursor:pointer;
    transition: color .2s ease, background .2s ease, border-color .2s ease, opacity .08s ease;
    outline: none;
  }
  .calc-icon-btn:focus{ outline: none; }
  .calc-icon-btn:focus-visible{ outline: none; }
  .calc-icon-btn svg{
    width: 19px; height: 19px;
    fill:none;
    stroke: currentColor;
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  @media (hover: hover) and (pointer: fine){
    .calc-icon-btn:hover{ color: var(--fg); border-color: var(--btn-border); }
  }
  .calc-icon-btn:active{ opacity: .6; }
  .calc-icon-btn.active{ color: #000; background: var(--fg); border-color: var(--fg); }

  #calcFxToggle:not(.active){
    border-color: transparent;
    color: var(--fg);
  }

  .fx-icon-fn{
    font-family: inherit;
    font-size: 13px;
    font-weight: 100;
    font-style: italic;
    letter-spacing: 0.01em;
    color: currentColor;
  }

  .history-list{
    width: 100%;
    max-height: 52vh;
    overflow-y: auto;
    display:flex;
    flex-direction: column;
    counter-reset: hx;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .history-list::-webkit-scrollbar{ display:none; }

  .history-empty{
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--fg-faint);
    text-align: center;
    padding: 10px 0;
  }

  .history-item{
    position: relative;
    background:none;
    border:none;
    font-family: inherit;
    display:flex;
    flex-direction: column;
    align-items:flex-end;
    gap: 7px;
    width: 100%;
    cursor:pointer;
    padding: 16px 4px 16px 40px;
    margin: 0 -4px;
    border-bottom: 1px solid var(--hairline);
    -webkit-user-select:none; user-select:none;
    border-radius: 8px;
    transition: background-color .15s ease, opacity .08s ease;
  }
  .history-item::before{
    counter-increment: hx;
    content: counter(hx, decimal-leading-zero);
    position: absolute;
    left: 4px;
    top: 18px;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--fg-faint);
    font-variant-numeric: tabular-nums;
  }
  .history-item:first-child{ padding-top: 4px; }
  .history-item:first-child::before{ top: 6px; }
  .history-item:last-child{ border-bottom:none; padding-bottom: 10px; }

  .history-item:active{ background: rgba(255,255,255,0.07); opacity: 1; }
  .history-item .hx-expr{
    font-size: 13px;
    font-weight: 100;
    letter-spacing: 0.01em;
    color: #93939a;
    text-align: right;

  .history-item .hx-result{
    font-size: 24px;
    font-weight: 100;

  }

  .calc-display{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:flex-end;
    gap: 9px;
    min-height: 0;
    height: clamp(85px, 15vh, 125px);
    padding: 0 18px 16px;
    border-bottom: 1px solid var(--fg);
    margin: 0 18px;
  }

  .calc-expr{
    font-size: 13px;
    font-weight: 100;
    color: var(--fg-dim);
    letter-spacing: 0.02em;
    min-height: 16px;
    width: 100%;
    text-align: right;
  }

  .calc-result{
    font-weight: 100;
    font-size: clamp(38px, 12.4vw, 54px);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    color: var(--fg);
    width: 100%;
    display: flex;
    justify-content: flex-end;
    overflow: hidden;
    touch-action: pan-y;
    -webkit-mask-image: none;
    mask-image: none;
  }

  .calc-result-inner{
    display: inline-block;
    white-space: nowrap;
    will-change: transform;
  }

  .calc-deg-row{
    display:flex;
    justify-content:flex-end;
    flex-shrink:0;
    padding: 0 18px;
  }

  .calc-mode-toggle{
    margin: 0;
  }

  .calc-keypad-area{
    flex: 1;
    min-height: 0;
    display:flex;
    flex-direction: column;
    gap: clamp(6px, 1.4vh, 12px);
    overflow: hidden;
    contain: layout style;
  }

  .calc-grid{
    flex: 1;
    min-height: 0;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr) calc(env(safe-area-inset-bottom) / 2);
    background: var(--bg);
    contain: layout style;
  }

  .calc-key{
    border: none;
    border-right: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
    font-weight: 100;
    font-size: clamp(22px, 8.4vw, 36px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
    transition: opacity .08s ease, color .16s ease;
    min-height: 0;
    overflow: hidden;
  }
  .calc-key:active{ opacity: .5; }
  .calc-key.op{ color: var(--fg); background: rgba(255,255,255,0.05); }
  .calc-key.muted{ font-size: clamp(17px, 5.2vw, 22px); letter-spacing:.08em; text-transform:uppercase; color: var(--fg); font-weight:400; background: rgba(255,255,255,0.05); }
  .calc-key.muted.calc-key-back{ letter-spacing: 0; text-transform: none; font-weight: 100; }
  .backspace-icon{
    width: clamp(24px, 8vw, 32px);
    height: auto;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: block;
  }
  .calc-key.equals{ background: var(--fg); color:#000; font-weight:100; }
  .calc-key.equals:active{ opacity:.7; }
  .calc-key.wide{ grid-column: span 2; }

  /* outer frame removed — only the hairlines between cells remain */
  .calc-grid .calc-key.op,
  .calc-grid .calc-key.equals{ border-right: none; }
  .calc-grid .calc-key--bottom{ border-bottom: none; grid-row: span 2; padding-bottom: calc(env(safe-area-inset-bottom) / 2); }

  .calc-fx-section[hidden]{ display:none; }

  /* The fx-section's own flex-basis is now always set instantly (in JS,
     never transitioned) — animating flex-basis is a layout property, and
     since the basic grid below is flex:1, transitioning it forced the
     basic grid's CSS Grid track sizes to be recomputed AND repainted on
     every single animation frame. Only opacity (compositor-only) is
     transitioned here; the actual "grow/shrink" motion is faked with a
     transform on the basic grid — see setCalcFxExpanded() in the script. */
  .calc-fx-section{
    flex: 0 0 0px;
    overflow: hidden;
    opacity: 0;
    contain: layout style;
    transition: opacity .76s cubic-bezier(.45,0,.15,1);
  }

  /* The grid lives at a FIXED height set once (in JS) when the panel opens,
     instead of stretching to match .calc-fx-section's animated height every
     frame. .calc-fx-section (above) just clips this box via overflow:hidden
     as its flex-basis grows/shrinks. This keeps the 3x5 CSS Grid's
     row-sizing a one-time layout instead of a recompute on every transition
     frame. (The DEG/RAD toggle used to live in a header row here, which
     made this box taller/more complex to lay out every time it opened —
     it now lives in the calculator's top .calc-header instead, so this
     box is just the grid.) */
  .calc-fx-inner{
    display:flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .calc-fx-grid{
    flex: 1;
    min-height: 0;
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: var(--bg);
    contain: layout style;
  }

  .calc-fx-key{
    border: none;
    border-right: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    background: rgba(255,255,255,0.015);
    color: var(--fg);
    font-family: inherit;
    font-weight: 100;
    font-size: clamp(16px, 5.4vw, 22px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
    transition: opacity .08s ease, color .16s ease;
  }
  .calc-fx-key:active{ opacity: .5; }
  .calc-fx-grid .calc-fx-key:nth-child(5n){ border-right: none; }
  .calc-fx-grid .calc-fx-key:nth-last-child(-n+5){ border-bottom: none; }

  /* ---- glyph veil/reveal during the basic/function keypad FLIP resize ----
     While the grid is being resized, its key glyphs would otherwise be
     visibly stretched/squashed right along with the container. Instead we
     drop the glyphs to transparent (borders & backgrounds stay put) the
     moment the resize kicks off, then — once it has settled at its final
     size — fade them back in softly. Covers both the basic-calc keys and
     the function-calc keys, since both live under #calcKeypadArea. */
  .calc-keypad-area.calc-text-veil .calc-key,
  .calc-keypad-area.calc-text-veil .calc-fx-key{
    color: transparent !important;
    transition: color 0s !important;
  }
  .calc-keypad-area.calc-text-reveal .calc-key,
  .calc-keypad-area.calc-text-reveal .calc-fx-key{
    transition: color .46s cubic-bezier(.22,1,.36,1) !important;
  }

  @media (prefers-reduced-motion: reduce){
    .dial-btn, .tab-indicator, .time-unit, .app-track, .orbit{ transition: none !important; }
    .dial-btn svg.icon-gear{ animation: none !important; }
    .ring-progress.phase-flash{ animation: none !important; }
    .calc-fx-section{ transition: none !important; }
    .calc-grid{ transition: none !important; }
  }
</style>

<script>
  const CUSTOM_STORAGE_KEY = 'pomodoroCustomPreset';
  const CUSTOM_DEFAULT = { work: 10 * 60, brk: 2 * 60 };
  const CUSTOM_MIN_MINUTES = 1;
  const CUSTOM_MAX_MINUTES = 180;

  function loadCustomPreset(){
    try{
      const raw = localStorage.getItem(CUSTOM_STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        const maxSec = CUSTOM_MAX_MINUTES * 60;
        const w = Math.round(parsed.work), b = Math.round(parsed.brk);
        if(Number.isFinite(w) && Number.isFinite(b)
           && w >= CUSTOM_MIN_MINUTES * 60 && w <= maxSec && b >= 0 && b <= maxSec){
          return { work: w, brk: b };
        }
      }
    }catch(e){ }
    return { work: CUSTOM_DEFAULT.work, brk: CUSTOM_DEFAULT.brk };
  }

  function saveCustomPreset(work, brk){
    try{ localStorage.setItem(CUSTOM_STORAGE_KEY, JSON.stringify({ work, brk })); }catch(e){ }
  }

  const initialCustom = loadCustomPreset();

  /* ---------- app settings (persisted) ---------- */
  const SETTINGS_KEY = 'pomodoroSettings';
  const PRESET_TIMES_KEY = 'pomodoroPresetTimes';
  const BG_CHOICES = ['#20201F', '#000000', '#0E1620', '#10201A', '#241518', '#1B1626'];
  const BEEP_STYLES = [
    { id: 'chime',   label: 'Chime' },
    { id: 'soft',    label: 'Soft' },
    { id: 'double',  label: 'Double' },
    { id: 'triple',  label: 'Triple' },

  function syncTimers(){

    for(let i = 0; i < PRESETS.length; i++){

      while(now >= s.endTimestamp && steps < 5000){

  const RING_EASE_TAU_MS = 260;
  let mainLoopLastFrame = null;

  function mainLoop(ts){
    if(mainLoopLastFrame === null) mainLoopLastFrame = ts;
    const dt = Math.min(64, ts - mainLoopLastFrame);
    mainLoopLastFrame = ts;
    syncTimers();
    for(let i = 0; i < PRESETS.length; i++){
      const s = states[i];
      const rem = liveRemaining(s);
      if(s.displayRemaining == null) s.displayRemaining = rem;
      const factor = 1 - Math.exp(-dt / RING_EASE_TAU_MS);
      s.displayRemaining += (rem - s.displayRemaining) * factor;
      if(Math.abs(rem - s.displayRemaining) < 0.008) s.displayRemaining = rem;
      if(appPageIndex === 0) render(i, rem, false);
    }
    requestAnimationFrame(mainLoop);
  }
  requestAnimationFrame(mainLoop);

  // rAF is throttled/stopped in the background, so phase changes are also
  // driven by a wall-clock interval and re-synced on return to the app.
  setInterval(() => { syncTimers(); lofi.sync(); }, 1000);
  function resyncOnReturn(){ if(!document.hidden){ syncTimers(); mainLoopLastFrame = null; } }
  document.addEventListener('visibilitychange', resyncOnReturn);
  window.addEventListener('pageshow', resyncOnReturn);
  window.addEventListener('focus', resyncOnReturn);

  function start(){
    const s = states[presetIndex];
    cancelResetAnim(presetIndex);
    states.forEach((other, i) => {
      if(i !== presetIndex && (other.running || other.remaining < other.totalSec
          || other.mode !== 'work' || other.altPhase !== 0 || other.cycles > 0)){
        states[i] = makeState(i);
        render(i, states[i].remaining, true);
      }
    });
    ensureNotificationPermission();
    getAudioCtx();
    s.running = true;
    if(s.remaining <= 0){
      s.remaining = s.totalSec;
    }
    s.endTimestamp = Date.now() + s.remaining * 1000;
    s.lastShownSec = null;
    render(presetIndex, s.remaining, true);
    updateControls();
    lofi.sync();
  }

  function pause(){
    const s = states[presetIndex];
    s.remaining = liveRemaining(s);
    s.running = false;
    s.endTimestamp = null;
    render(presetIndex, s.remaining, true);
    updateControls();
    lofi.sync();
  }

  function cancelResetAnim(idx){
    const s = states[idx];
    if(s.resetAnimId){ cancelAnimationFrame(s.resetAnimId); s.resetAnimId = null; }
  }

  function resetAnimated(idx){
    const s = states[idx];
    cancelResetAnim(idx);
    const trueRemaining = liveRemaining(s);   // read BEFORE clearing running/endTimestamp
    s.running = false;
    s.endTimestamp = null;
    s.remaining = trueRemaining;

    const preset = PRESETS[idx];
    const targetTotal = preset.type === 'cycle' ? preset.work : preset.durations[0];

    s.mode = 'work';
    s.altPhase = 0;
    s.cycles = 0;
    s.totalSec = targetTotal;

    const startRemaining = Math.max(0, Math.floor(s.remaining));
    const gap = targetTotal - startRemaining;
    if(gap === 0){
      s.remaining = targetTotal;
      s.lastShownSec = null;
      if(idx === presetIndex) updateControls();
      return;
    }

    const duration = Math.min(1200, Math.max(300, 300 + Math.abs(gap) * 0.4));
    const startTime = performance.now();

    function step(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      s.remaining = startRemaining + Math.round(gap * eased);
      if(t >= 1){
        s.remaining = targetTotal;
        s.resetAnimId = null;
        if(idx === presetIndex) updateControls();
        return;
      }
      s.resetAnimId = requestAnimationFrame(step);
    }
    s.resetAnimId = requestAnimationFrame(step);
  }

  function reset(){
    resetAnimated(presetIndex);
    lofi.sync();
  }

  const MIN_STEP = 60;
  const SEC_STEP = 10;
  const MIN_TOTAL_SEC = 10;

  const ARM_THRESHOLD_PX = 34;
  const HOLD_START_DELAY = 600;
  const HOLD_REPEAT_MS = 720;
  const PULL_MAX_PX = 15;
  const PULL_TAU_PX = 46;

  const DIST_FOR_MAX_SPEED = 160;
  const HOLD_REPEAT_FAST_MS = 70;

  function repeatIntervalFor(dy){
    const dist = Math.max(0, Math.abs(dy) - ARM_THRESHOLD_PX);
    const t = Math.min(1, dist / DIST_FOR_MAX_SPEED);
    return HOLD_REPEAT_MS - t * (HOLD_REPEAT_MS - HOLD_REPEAT_FAST_MS);
  }

  const DOUBLE_TAP_MS = 320;
  let lastCustomTapTime = 0;

  let dragState = null;

  function extendTimer(idx, amountSec){
    const s = states[idx];
    cancelResetAnim(idx);
    s.remaining = liveRemaining(s);           // never trust a stale s.remaining
    let applied = amountSec;
    if(applied < 0){
      const room = s.remaining - MIN_TOTAL_SEC;
      if(room <= 0) return false;
      applied = Math.max(applied, -room);
    } else if(applied > 0){
      const maxRemaining = s.totalSec * 2;
      const room = maxRemaining - s.remaining;
      if(room <= 0) return false;
      applied = Math.min(applied, room);
    }
    if(applied === 0) return false;
    s.remaining = Math.max(0, s.remaining + applied);
    if(s.running && s.endTimestamp !== null){
      s.endTimestamp = Date.now() + s.remaining * 1000;
    }
    if(idx === presetIndex) updateControls();
    return true;
  }

  function rubberBandOffset(rawDy){
    const dir = Math.sign(rawDy);
    const dist = Math.abs(rawDy);
    return dir * PULL_MAX_PX * (1 - Math.exp(-dist / PULL_TAU_PX));
  }

  function updateDragVisual(dy){
    if(!dragState || !dragState.el) return;
    dragState.el.style.transform = `translateY(${rubberBandOffset(dy).toFixed(2)}px)`;
  }

  function clearHoldTimer(){
    if(dragState && dragState.holdTimer){ clearTimeout(dragState.holdTimer); dragState.holdTimer = null; }
  }
  function clearRepeatTimer(){
    if(dragState && dragState.repeatTimer){ clearTimeout(dragState.repeatTimer); dragState.repeatTimer = null; }
  }

  function fireStep(dir){
    if(!dragState) return;
    const applied = extendTimer(dragState.idx, dragState.step * dir);
    if(!applied){
      clearHoldTimer();
      clearRepeatTimer();
    }
    return applied;
  }

  function runHoldRepeat(){
    if(!dragState) return;
    const dy = dragState.lastY - dragState.startY;
    if(Math.abs(dy) < ARM_THRESHOLD_PX || Math.sign(dy) !== dragState.direction) return;
    dragState.repeatCount += 1;
    if(!fireStep(dragState.direction)) return;
    dragState.repeatTimer = setTimeout(runHoldRepeat, repeatIntervalFor(dy));
  }

  function scheduleHoldRepeat(){
    clearHoldTimer();
    if(!dragState) return;
    dragState.holdTimer = setTimeout(() => {
      if(!dragState) return;
      const dy = dragState.lastY - dragState.startY;
      if(Math.abs(dy) >= ARM_THRESHOLD_PX && Math.sign(dy) === dragState.direction) runHoldRepeat();
    }, HOLD_START_DELAY);
  }

  function beginTimeDrag(unitEl, clientY){
    const idx = parseInt(unitEl.dataset.preset, 10);
    const unit = unitEl.dataset.unit;
    dragState = {
      idx, unit,
      step: unit === 'min' ? MIN_STEP : SEC_STEP,
      el: unitEl,
      startY: clientY,
      lastY: clientY,
      armed: false,
      direction: 0,
      repeatCount: 0,
      holdTimer: null,
      repeatTimer: null
    };
    unitEl.classList.remove('releasing');
    unitEl.classList.add('dragging');
  }

  function onTimeDragMove(clientY){
    if(!dragState) return;
    dragState.lastY = clientY;
    const dy = clientY - dragState.startY;
    updateDragVisual(dy);

    if(!dragState.armed){
      if(Math.abs(dy) >= ARM_THRESHOLD_PX){
        dragState.direction = Math.sign(dy);
        dragState.armed = true;
        dragState.repeatCount = 0;
        fireStep(dragState.direction);
        scheduleHoldRepeat();
      }
      return;
    }

    const sign = Math.sign(dy);
    if(Math.abs(dy) >= ARM_THRESHOLD_PX){
      if(sign === dragState.direction){
        if(!dragState.holdTimer && !dragState.repeatTimer) scheduleHoldRepeat();
      } else {
        clearHoldTimer();
        clearRepeatTimer();
        dragState.direction = sign;
        dragState.startY = clientY;
        dragState.repeatCount = 0;
        fireStep(dragState.direction);
        scheduleHoldRepeat();
      }
    } else {
      clearHoldTimer();
      clearRepeatTimer();
    }
  }

  function registerCustomTap(){
    const now = Date.now();
    if(now - lastCustomTapTime < DOUBLE_TAP_MS){
      lastCustomTapTime = 0;
      openCustomModal();
    } else {
      lastCustomTapTime = now;
    }
  }

  function endTimeDrag(cancelled){
    if(!dragState) return;
    const el = dragState.el;
    const idx = dragState.idx;
    const wasTap = !dragState.armed;
    clearHoldTimer();
    clearRepeatTimer();
    el.classList.remove('dragging');
    el.classList.add('releasing');
    el.style.transform = 'translateY(0px)';
    setTimeout(() => { el.classList.remove('releasing'); }, 480);
    dragState = null;

    if(wasTap && idx === 0 && !cancelled) registerCustomTap();
  }

  document.querySelectorAll('.time-unit').forEach(unitEl => {
    unitEl.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      beginTimeDrag(unitEl, e.touches[0].clientY);
    }, { passive: true });

    unitEl.addEventListener('touchmove', (e) => {
      if(!dragState || dragState.el !== unitEl) return;
      e.stopPropagation();
      e.preventDefault();
      onTimeDragMove(e.touches[0].clientY);
    }, { passive: false });

      if(!dragState || dragState.el !== unitEl) return;
      e.stopPropagation();
      e.preventDefault();

  const customColon = document.querySelector('#time0 .time-colon');
  if(customColon){

      e.stopPropagation();

      registerCustomTap();
    });
    customColon.addEventListener('click', (e) => {
      e.stopPropagation();
      registerCustomTap();
    });
  }

  const dialPages = [...track.querySelectorAll('.dial-page')];

  function pageVisualFor(absT){
    const c = Math.min(1, absT);
    const opacity = Math.pow(1 - c, 2);
    const scale = 1 - 0.12 * c;
    return { opacity, scale };
  }

  function updatePageVisuals(trackX){
    if(!vw) return;
    dialPages.forEach((page, idx) => {
      const t = idx + trackX / vw;
      const { opacity, scale } = pageVisualFor(Math.abs(t));
      page.style.opacity = opacity;
      page.style.transform = `scale(${scale})`;
    });
  }

  let vw = 0;
  function measure(){ vw = viewport.clientWidth; }
  measure();
  function handleViewportResize(){
    measure();
    track.style.transform = `translateX(${baseX()}px)`;
