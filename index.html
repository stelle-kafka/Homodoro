  }
  window.addEventListener('resize', handleViewportResize);
  window.addEventListener('orientationchange', () => setTimeout(handleViewportResize, 50));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', handleViewportResize);
  }

  function baseX(){ return -presetIndex * vw; }

  track.style.transform = `translateX(${baseX()}px)`;
  updatePageVisuals(baseX());
  moveIndicator();

  let settleAnimId = null;
  function cancelSettleAnim(){
    if(settleAnimId !== null){ cancelAnimationFrame(settleAnimId); settleAnimId = null; }
  }

  function settle(fromPx, toPx){
    cancelSettleAnim();
    if(toPx === fromPx){
      track.style.transform = `translateX(${toPx}px)`;
      updatePageVisuals(toPx);
      return;
    }
    const duration = 560;
    const startTime = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    function step(now){
      const t = Math.min(1, (now - startTime) / duration);
      const x = fromPx + (toPx - fromPx) * ease(t);
      track.style.transform = `translateX(${x}px)`;
      updatePageVisuals(x);
      if(t < 1){
        settleAnimId = requestAnimationFrame(step);
      } else {
        settleAnimId = null;
      }
    }
    settleAnimId = requestAnimationFrame(step);
  }

  function viewPreset(target){
    presetIndex = target;
    const s = states[presetIndex];
    const remFloat = s.running ? Math.max(0, (s.endTimestamp - Date.now()) / 1000) : s.remaining;
    render(presetIndex, remFloat, true);
    updateControls();
    moveIndicator();
  }

  function goToPreset(target){
    if(target < 0 || target >= PRESETS.length || target === presetIndex) return;
    const fromPx = baseX();
    viewPreset(target);
    settle(fromPx, baseX());
  }

  presetTabs.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if(!tab) return;
    goToPreset(parseInt(tab.dataset.index, 10));
  });

  viewport.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    onDragStart(e.touches[0].clientX);
  }, { passive: true });
  viewport.addEventListener('touchmove', (e) => { e.stopPropagation(); e.preventDefault(); onDragMove(e.touches[0].clientX); }, { passive: false });
  viewport.addEventListener('touchend', (e) => { e.stopPropagation(); onDragEnd(e.changedTouches[0].clientX); });
  viewport.addEventListener('touchcancel', (e) => {
    e.stopPropagation();
    if(!dragging) return;
    dragging = false;
    const fromPx = baseX() + dragDelta;
    dragDelta = 0;
    settle(fromPx, baseX());
  });

  let dragStartX = null;
  let dragging = false;
  let dragDelta = 0;

  function onDragStart(x){
    cancelSettleAnim();
    track.style.transform = `translateX(${baseX()}px)`;
    updatePageVisuals(baseX());
    dragStartX = x;
    dragging = true;
    dragDelta = 0;
  }
  function onDragMove(x){
    if(!dragging) return;
    let dx = x - dragStartX;
    const atLeftEdge = presetIndex === 0 && dx > 0;
    const atRightEdge = presetIndex === PRESETS.length - 1 && dx < 0;
    if(atLeftEdge || atRightEdge) dx *= 0.3;
    dragDelta = dx;
    const x2 = baseX() + dx;
    track.style.transform = `translateX(${x2}px)`;
    updatePageVisuals(x2);
  }
  function onDragEnd(x){
    if(!dragging) return;
    dragging = false;
    const dx = dragDelta;
    const threshold = vw * 0.22;
    const oldIndex = presetIndex;
    let target = oldIndex;
    if(dx <= -threshold && oldIndex < PRESETS.length - 1) target = oldIndex + 1;
    else if(dx >= threshold && oldIndex > 0) target = oldIndex - 1;

    const fromPx = -oldIndex * vw + dx;

    if(target !== oldIndex){
      viewPreset(target);
    }
    settle(fromPx, baseX());
  }

  viewport.addEventListener('mousedown', (e) => { e.stopPropagation(); onDragStart(e.clientX); });
  window.addEventListener('mousemove', (e) => { if(dragging) onDragMove(e.clientX); });
  window.addEventListener('mouseup', (e) => { if(dragging) onDragEnd(e.clientX); });

  const customModal     = document.getElementById('customModal');
  const customCancelBtn = document.getElementById('customCancelBtn');
  const customApplyBtn  = document.getElementById('customApplyBtn');

  const CUSTOM_MAX_SEC = CUSTOM_MAX_MINUTES * 60;

  // One MM:SS field backed by a single total-seconds value.
  // Minutes unit steps by 60s, seconds unit steps by 1s (carries/borrows naturally).
  function createTimeField(minEl, secEl, initial, lo, hi){
    const field = {
      value: Math.min(hi, Math.max(lo, initial)), lo, hi,
      paint(){
        minEl.textContent = String(Math.floor(this.value / 60)).padStart(2, '0');
        secEl.textContent = String(this.value % 60).padStart(2, '0');
      }
    };
    createDragUnit(minEl, field, 60);
    createDragUnit(secEl, field, 1);
    field.paint();
    return {
      setValue(v){ field.value = Math.min(hi, Math.max(lo, v)); field.paint(); },
      getValue(){ return field.value; }
    };
  }

  function createDragUnit(el, field, stepSize){
    let drag = null;
    let lastTapTime = 0;

    // Double-tap on a seconds unit -> reset its seconds to 00.
    function resetSeconds(){
      const next = field.value - (field.value % 60);
      if(next < field.lo || next === field.value) return;
      field.value = next;
      field.paint();
    }

    function clearHold(){ if(drag && drag.holdTimer){ clearTimeout(drag.holdTimer); drag.holdTimer = null; } }
    function clearRepeat(){ if(drag && drag.repeatTimer){ clearTimeout(drag.repeatTimer); drag.repeatTimer = null; } }

    function applyStep(dir){
      let next = field.value + dir * stepSize;
      if(field.wrap){
        // Circular list: stepping past either end comes round to the other.
        const span = field.hi - field.lo + stepSize;
        next = (((next - field.lo) % span) + span) % span + field.lo;
      } else {
        if(stepSize > 1 && (next < field.lo || next > field.hi)) next = field.value;
        next = Math.min(field.hi, Math.max(field.lo, next));
      }
      if(next === field.value){ clearHold(); clearRepeat(); return false; }
      field.value = next;
      field.paint();
      return true;
    }

    function runHoldRepeat(){
      if(!drag) return;
      const dy = drag.lastY - drag.startY;
      if(Math.abs(dy) < ARM_THRESHOLD_PX || Math.sign(dy) !== drag.direction) return;
      drag.repeatCount += 1;
      if(!applyStep(drag.direction)) return;
      drag.repeatTimer = setTimeout(runHoldRepeat, repeatIntervalFor(dy));
    }

    function scheduleHoldRepeat(){
      clearHold();
      if(!drag) return;
      drag.holdTimer = setTimeout(() => {
        if(!drag) return;
        const dy = drag.lastY - drag.startY;
        if(Math.abs(dy) >= ARM_THRESHOLD_PX && Math.sign(dy) === drag.direction) runHoldRepeat();
      }, HOLD_START_DELAY);
    }

    function begin(clientY){
      drag = { startY: clientY, lastY: clientY, armed: false, direction: 0, repeatCount: 0, holdTimer: null, repeatTimer: null };
      el.classList.remove('releasing');
      el.classList.add('dragging');
    }

    function move(clientY){
      if(!drag) return;
      drag.lastY = clientY;
      const dy = clientY - drag.startY;
      el.style.transform = `translateY(${rubberBandOffset(dy).toFixed(2)}px)`;

      if(!drag.armed){
        if(Math.abs(dy) >= ARM_THRESHOLD_PX){
          drag.direction = Math.sign(dy);
          drag.armed = true;
          drag.repeatCount = 0;
          applyStep(drag.direction);
          scheduleHoldRepeat();
        }
        return;
      }

      const sign = Math.sign(dy);
      if(Math.abs(dy) >= ARM_THRESHOLD_PX){
        if(sign === drag.direction){
          if(!drag.holdTimer && !drag.repeatTimer) scheduleHoldRepeat();
        } else {
          clearHold();
          clearRepeat();
          drag.direction = sign;
          drag.startY = clientY;
          drag.repeatCount = 0;
          applyStep(drag.direction);
          scheduleHoldRepeat();
        }
      } else {
        clearHold();
        clearRepeat();
      }
    }

    function end(cancelled){
      if(!drag) return;
      if(!cancelled && !drag.armed && field.onTap) field.onTap();
      if(!cancelled && stepSize === 1 && !drag.armed){
        const now = Date.now();
        if(now - lastTapTime < 320){ lastTapTime = 0; resetSeconds(); }
        else { lastTapTime = now; }
      }
      clearHold();
      clearRepeat();
      el.classList.remove('dragging');
      el.classList.add('releasing');
      el.style.transform = 'translateY(0px)';
      setTimeout(() => { el.classList.remove('releasing'); }, 480);
      drag = null;
    }

    el.addEventListener('touchstart', (e) => { e.stopPropagation(); begin(e.touches[0].clientY); }, { passive: true });
    el.addEventListener('touchmove', (e) => { if(!drag) return; e.stopPropagation(); e.preventDefault(); move(e.touches[0].clientY); }, { passive: false });
    el.addEventListener('touchend', (e) => { if(!drag) return; e.stopPropagation(); e.preventDefault(); end(); });
    el.addEventListener('touchcancel', (e) => { if(!drag) return; e.stopPropagation(); e.preventDefault(); end(true); });
    el.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); begin(e.clientY); });
    window.addEventListener('mousemove', (e) => { if(drag) move(e.clientY); });
    window.addEventListener('mouseup', () => { if(drag) end(); });

  }

  const workPicker = createTimeField(
    document.getElementById('customWorkMin'),
    document.getElementById('customWorkSec'),
    PRESETS[0].durations[0], 1, CUSTOM_MAX_SEC
  );
  const breakPicker = createTimeField(
    document.getElementById('customBreakMin'),
    document.getElementById('customBreakSec'),
    PRESETS[0].durations[1], 0, CUSTOM_MAX_SEC
  );

  function openCustomModal(){
    document.documentElement.classList.add('modal-locked');
    customModal.hidden = false;
    workPicker.setValue(PRESETS[0].durations[0]);
    breakPicker.setValue(PRESETS[0].durations[1]);
  }

  function closeCustomModal(){
    customModal.hidden = true;
    document.documentElement.classList.remove('modal-locked');
  }

  customCancelBtn.addEventListener('click', closeCustomModal);
  customModal.addEventListener('click', (e) => { if(e.target === customModal) closeCustomModal(); });
  customModal.addEventListener('touchmove', (e) => { if(e.target === customModal) e.preventDefault(); }, { passive: false });

  customApplyBtn.addEventListener('click', () => {
    const workSec = workPicker.getValue();
    const brkSec = breakPicker.getValue();
    PRESETS[0].durations = [workSec, brkSec];
    saveCustomPreset(workSec, brkSec);
    updateCustomTabLabel();
    cancelResetAnim(0);
    states[0] = makeState(0);
    render(0, states[0].remaining, true);
    if(presetIndex === 0) updateControls();
    closeCustomModal();
  });

  // Settings screen lives at the end of this script.
  function openSettings(){ openSettingsModal(); }

  // A drag on the button (hidden gesture below) must not also fire its action
  // when the finger lifts.
  let suppressClickUntil = 0;
  startPauseBtn.addEventListener('click', () => {
    if(performance.now() < suppressClickUntil) return;
    if(settingsMode){ openSettings(); return; }
    if(states[presetIndex].running) pause(); else start();
  });
  resetBtn.addEventListener('click', () => reset());

  /* =====================================================================
     Hidden gesture — start/pause becomes the Settings button
     Hold start/pause, trace one clockwise circle around a point below it,
     return to the start, then (still holding) carry the button to the
     circle's centre: it turns into the Settings button. Throw the Settings
     button upward with enough speed and it flies back and becomes the
     start/pause button again.
     ===================================================================== */
  (function initSettingsGesture(){
    const TAU = Math.PI * 2;
    const MOVE_SLOP = 8;            // px of travel before a press becomes a drag
    const LOOP_TOLERANCE = 0;       // must be a complete turn, back exactly at home
    const FLICK_V = 0.9;            // px/ms upward needed to count as a throw
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const orbit = document.getElementById('orbit');
    const orbitTrack = orbit.querySelector('.orbit-track');
    const orbitProg = orbit.querySelector('.orbit-progress');

    /* The button never follows the finger freely: it only travels along a
       fixed route.
         start/pause -> circle (clockwise, back to home) -> straight line to
                        the circle's centre
         Settings    -> straight vertical line between the centre and home
       The finger only decides how far along the route the button is. */

    let g = null;                   // active gesture
    let settingsR = 92;             // where the Settings button rests (px below home)
    const pos = { x: 0, y: 0 };     // button offset from its home position
    let springId = null;

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    function setPos(x, y){
      pos.x = x; pos.y = y;
      startPauseBtn.style.translate = x + 'px ' + y + 'px';
    }

    function cancelSpring(){
      if(springId !== null){ cancelAnimationFrame(springId); springId = null; }
    }

    // Damped spring toward (tx, ty); velocities in px/s.
    function runSpring(tx, ty, vx, vy, k, c, done){
      cancelSpring();
      if(reduceMotion.matches){ setPos(tx, ty); if(done) done(); return; }
      let x = pos.x, y = pos.y, last = performance.now(), acc = 0;
      const STEP = 1 / 240;
      function frame(now){
        acc += Math.min(0.05, (now - last) / 1000); last = now;
        while(acc >= STEP){
          vx += (-k * (x - tx) - c * vx) * STEP;
          vy += (-k * (y - ty) - c * vy) * STEP;
          x += vx * STEP; y += vy * STEP; acc -= STEP;
        }
        setPos(x, y);
        if(Math.abs(x - tx) < 0.4 && Math.abs(y - ty) < 0.4 && Math.abs(vx) < 10 && Math.abs(vy) < 10){
          setPos(tx, ty); springId = null; if(done) done(); return;
        }
        springId = requestAnimationFrame(frame);
      }
      springId = requestAnimationFrame(frame);
    }

    // Point on the circle (offset from home) after turning u rad clockwise
    // from the top. The circle's centre sits R px below home.
    function circlePt(R, u){
      const a = -Math.PI / 2 + u;
      return { x: R * Math.cos(a), y: R + R * Math.sin(a) };
    }

    // Send the button back home the way it came: back along the line, then
    // along the circle (the shorter way round) - never cutting across.
    function returnAlongRoute(gg){
      cancelSpring();
      const R = gg.R, segs = [];
      const arc = (u0, u1) => ({ n: R * Math.abs(u1 - u0), at: f => circlePt(R, u0 + (u1 - u0) * f) });
      if(gg.loop){
        if(gg.s > 0){
          segs.push({ n: gg.clen * gg.s, at: f => {
            const k = gg.s * (1 - f);
            return { x: gg.p0.x + gg.cx * k, y: gg.p0.y + gg.cy * k };
          } });
        }
        segs.push(arc(gg.u, TAU));
      } else {
        segs.push(arc(gg.u, gg.u < TAU / 2 ? 0 : TAU));
      }
      const total = segs.reduce((sum, sg) => sum + sg.n, 0);
      if(reduceMotion.matches || total < 1){ setPos(0, 0); backAtHome(); return; }
      const dur = Math.min(650, 200 + total * 1.6);
      const t0 = performance.now();
      function frame(now){
        const t = Math.min(1, (now - t0) / dur);
        let d = (1 - Math.pow(1 - t, 3)) * total;
        let p = { x: 0, y: 0 };
        for(let i = 0; i < segs.length; i++){
          const sg = segs[i];
          if(d <= sg.n || i === segs.length - 1){ p = sg.at(sg.n > 0 ? Math.min(1, d / sg.n) : 1); break; }
          d -= sg.n;
        }
        setPos(p.x, p.y);
        if(t < 1){ springId = requestAnimationFrame(frame); }
        else { springId = null; setPos(0, 0); backAtHome(); }
      }
      springId = requestAnimationFrame(frame);
    }

    function syncFace(){
      startPauseBtn.classList.toggle('gear-size', settingsMode || settingsPreview);
      updateControls();
    }

    function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){ } }

    /* ----- orbit guide (play-button gesture only) ----- */

    function showOrbit(){
      const size = 2 * g.R + 4, c = g.R + 2;
      orbit.setAttribute('width', size);
      orbit.setAttribute('height', size);
      orbit.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
      orbit.style.left = (g.px - c) + 'px';
      orbit.style.top  = (g.py - c) + 'px';
      [orbitTrack, orbitProg].forEach(el => {
        el.setAttribute('cx', c); el.setAttribute('cy', c); el.setAttribute('r', g.R);
      });
      g.circ = TAU * g.R;
      orbitProg.setAttribute('stroke-dasharray', g.circ.toFixed(2));
      orbitProg.setAttribute('stroke-dashoffset', g.circ.toFixed(2));
      orbit.classList.remove('done');
      orbit.classList.add('on');
    }
    function updateOrbit(p){
      orbitProg.setAttribute('stroke-dashoffset', (g.circ * (1 - p)).toFixed(2));
    }
    function hideOrbit(){ orbit.classList.remove('on', 'done'); }

    function setZone(inZone){
      if(inZone === g.zone) return;
      g.zone = inZone;
      settingsPreview = inZone;      // preview the gear while hovering the centre
      syncFace();
      if(inZone) buzz(8);
    }

    /* ----- pointer handling ----- */

    startPauseBtn.addEventListener('pointerdown', (e) => {
      if(g) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      suppressClickUntil = 0;
      cancelSpring();
      // A press that lands while the button is still travelling starts from
      // the route's start again (the Settings button stays on its line).
      if(settingsMode) setPos(0, clamp(pos.y, 0, settingsR));
      else setPos(0, 0);
      const r = startPauseBtn.getBoundingClientRect();
      const hx = r.left + r.width / 2 - pos.x;      // home centre (undo any offset)
      const hy = r.top + r.height / 2 - pos.y;
      const R = Math.max(88, Math.min(96, (window.innerHeight - hy - 28) / 2));
      g = {
        id: e.pointerId, fx: e.clientX, fy: e.clientY,
        by: pos.y,                                  // offset at grab time
        hx, hy, R, px: hx, py: hy + R,              // circle centre (pivot)
        fromSettings: settingsMode,
        prev: -Math.PI / 2,                         // finger angle round the centre
        u: 0,                                       // clockwise progress round the circle (rad)
        loop: false, zone: false, moved: false, circ: 0,
        p0: null, cx: 0, cy: 0, clen: 1, dRef: null, s: 0,   // straight run to the centre
        samples: []
      };
      try{ startPauseBtn.setPointerCapture(e.pointerId); }catch(err){ }
    });

    startPauseBtn.addEventListener('pointermove', (e) => {
      if(!g || e.pointerId !== g.id) return;
      const dx = e.clientX - g.fx, dy = e.clientY - g.fy;
      if(!g.moved){
        if(Math.hypot(dx, dy) < MOVE_SLOP) return;
        g.moved = true;
        startPauseBtn.classList.add('lifted');
        if(!g.fromSettings) showOrbit();
      }

      g.samples.push({ t: e.timeStamp, x: e.clientX, y: e.clientY });
      while(g.samples.length > 2 && e.timeStamp - g.samples[0].t > 120) g.samples.shift();

      // Settings button: only up/down its own line, between centre and home.
      if(g.fromSettings){ setPos(0, clamp(g.by + dy, 0, settingsR)); return; }

      const R = g.R;
      if(!g.loop){
        // Finger angle round the circle's centre drives the button along the
        // circle, clockwise only (backwards just returns it toward the start).
        const vx = dx, vy = dy - R;
        const rad = Math.hypot(vx, vy);
        const a = Math.atan2(vy, vx);
        if(rad > R * 0.45 && rad < R * 1.7){
          let d = a - g.prev;
          if(d > Math.PI) d -= TAU; else if(d < -Math.PI) d += TAU;
          g.u = clamp(g.u + d, 0, TAU);
        }
        g.prev = a;
        const pt = circlePt(R, g.u);
        setPos(pt.x, pt.y);
        updateOrbit(g.u / TAU);
        if(g.u >= TAU - LOOP_TOLERANCE - 1e-6){
          // Circle done: the route continues as a straight line from here to the centre.
          g.loop = true;
          g.u = TAU;
          g.p0 = { x: 0, y: 0 };                 // exactly home
          g.cx = 0; g.cy = R;                    // straight down, at a right angle to the circle
          g.clen = R;
          setPos(0, 0);
          g.dRef = { x: dx, y: dy };
          updateOrbit(1);
          orbit.classList.add('done');
          buzz(10);
        }
      } else {
        // Straight run: only the finger's movement along the line counts.
        const t = ((dx - g.dRef.x) * g.cx + (dy - g.dRef.y) * g.cy) / (g.clen * g.clen);
        g.s = clamp(t, 0, 1);
        setPos(g.p0.x + g.cx * g.s, g.p0.y + g.cy * g.s);
        setZone((1 - g.s) * g.clen < R * 0.35);
      }
    });

    // Release velocity in px/ms from the last ~100ms of movement.
    function releaseVelocity(e){
      const sm = g.samples;
      if(sm.length < 2) return { x: 0, y: 0 };
      const a = sm[0], b = sm[sm.length - 1];
      if(e.timeStamp - b.t > 80) return { x: 0, y: 0 };   // finger had stopped
      const dt = b.t - a.t;
      if(dt < 8) return { x: 0, y: 0 };
      return { x: (b.x - a.x) / dt, y: (b.y - a.y) / dt };
    }

    function backAtHome(){
      if(!settingsMode) startPauseBtn.classList.remove('lifted');
    }

    function endGesture(e, cancelled){
      if(!g || e.pointerId !== g.id) return;
      const gg = g;
      const v = gg.moved ? releaseVelocity(e) : { x: 0, y: 0 };
      g = null;
      try{ startPauseBtn.releasePointerCapture(e.pointerId); }catch(err){ }
      if(!gg.moved) return;                          // a plain tap: the click handler acts

      suppressClickUntil = performance.now() + 500;
      hideOrbit();

      if(gg.fromSettings){
        const thrownUp = !cancelled && v.y <= -FLICK_V && -v.y > 1.2 * Math.abs(v.x);
        if(thrownUp){
          // Launched straight up past home, settles back as the start/pause button.
          settingsMode = false;
          syncFace();
          buzz(12);
          const vy = Math.max(-700, Math.min(-350, v.y * 500));
          runSpring(0, 0, 0, vy, 260, 34, backAtHome);   // ~critically damped: small overshoot
        } else {
          runSpring(0, settingsR, 0, v.y * 400, 300, 26);
        }
        return;
      }

      if(!cancelled && gg.loop && gg.zone){
        // Placed at the centre: the start/pause button becomes the Settings button.
        settingsMode = true;
        settingsPreview = false;
        settingsR = gg.R;
        syncFace();
        buzz(12);
        runSpring(0, settingsR, 0, 0, 300, 26);
      } else {
        settingsPreview = false;
        syncFace();
        returnAlongRoute(gg);
      }
    }

    startPauseBtn.addEventListener('pointerup',     (e) => endGesture(e, false));
    startPauseBtn.addEventListener('pointercancel', (e) => endGesture(e, true));
    startPauseBtn.addEventListener('contextmenu',   (e) => { if(g) e.preventDefault(); });
  })();

  states.forEach((s, i) => render(i, s.remaining, true));
  updateControls();

  /* =====================================================================
     Calculator — recursive-descent expression parser (no eval)
     ===================================================================== */

  function calcTokenize(str){
    const tokens = [];
    let i = 0;
    while(i < str.length){
      const c = str[i];
      if(/\s/.test(c)){ i++; continue; }
      if(/[0-9.]/.test(c)){
        let j = i;
        let dotCount = 0;
        while(j < str.length && /[0-9.]/.test(str[j])){
          if(str[j] === '.') dotCount++;
          j++;
        }
        if(dotCount > 1){
          throw new Error('invalid number literal');
        }
        let numStr = str.slice(i, j);
        if(j < str.length && (str[j] === 'e' || str[j] === 'E')){
          let k = j + 1;
          if(k < str.length && (str[k] === '+' || str[k] === '-')) k++;
          const expDigitsStart = k;
          while(k < str.length && /[0-9]/.test(str[k])) k++;
          if(k > expDigitsStart){
            numStr = str.slice(i, k);
            j = k;
          }
        }
        tokens.push({ type:'num', value: parseFloat(numStr) });
        i = j; continue;
      }
      if(/[a-zA-Z]/.test(c)){
        let j = i;
        while(j < str.length && /[a-zA-Z]/.test(str[j])) j++;
        tokens.push({ type:'ident', value: str.slice(i,j).toLowerCase() });
        i = j; continue;
      }
      if('+-*/^()!'.includes(c)){
        tokens.push({ type:'op', value:c });
        i++; continue;
      }
      throw new Error('unsupported character: ' + c);
    }
    return tokens;
  }

  const CALC_CONSTANTS = { pi: Math.PI, e: Math.E };
  const CALC_FUNCS_1ARG = ['sin','cos','tan','asin','acos','atan','ln','log','sqrt','exp'];

  function calcFactorial(n){
    if(n < 0 || !Number.isInteger(n)) return NaN;
    if(n > 170) return Infinity;
    let r = 1;
    for(let k = 2; k <= n; k++) r *= k;
    return r;
  }

  function calcApplyFunc(name, x){
    const rad = a => calcDegMode ? a * Math.PI / 180 : a;
    const deg = a => calcDegMode ? a * 180 / Math.PI : a;
    const ZERO_EPS = 1e-10;
    const snapZero = v => (Math.abs(v) < ZERO_EPS ? 0 : v);
    switch(name){
      case 'sin': return snapZero(Math.sin(rad(x)));
      case 'cos': return snapZero(Math.cos(rad(x)));
      case 'tan': {
        if(calcDegMode){
          const m = ((x % 180) + 180) % 180;
          if(Math.abs(m - 90) < 1e-9) return NaN;
        } else {
          if(Math.abs(Math.cos(x)) < 1e-12) return NaN;
        }
        return snapZero(Math.tan(rad(x)));
      }
      case 'asin': return deg(Math.asin(x));
      case 'acos': return deg(Math.acos(x));
      case 'atan': return deg(Math.atan(x));
      case 'ln': return Math.log(x);
      case 'log': return Math.log10(x);
      case 'sqrt': return Math.sqrt(x);
      case 'exp': return Math.exp(x);
      default: throw new Error('unknown fn ' + name);
    }
  }

  function calcParse(tokens){
    let pos = 0;
    const peek = () => tokens[pos];
    const next = () => tokens[pos++];
    const isOp = (v) => { const t = peek(); return t && t.type === 'op' && t.value === v; };

    function parseExpr(){
      let left = parseTerm();
      while(isOp('+') || isOp('-')){
        const op = next().value;
        const right = parseTerm();
        left = op === '+' ? left + right : left - right;
      }
      return left;
    }
    function startsOperand(){
      const t = peek();
      if(!t) return false;
      if(t.type === 'num' || t.type === 'ident') return true;
      if(t.type === 'op' && t.value === '(') return true;
      return false;
    }
    function parseTerm(){
      let left = parseUnary();
      while(true){
        if(isOp('*') || isOp('/')){
          const op = next().value;
          const right = parseUnary();
          left = op === '*' ? left * right : left / right;
        } else if(startsOperand()){
          const right = parseUnary();
          left = left * right;
        } else {
          break;
        }
      }
      return left;
    }
    function parseUnary(){
      if(isOp('-')){ next(); return -parseUnary(); }
      if(isOp('+')){ next(); return parseUnary(); }
      return parsePower();
    }
    function parsePower(){
      let base = parsePostfix();
      if(isOp('^')){
        next();
        const exp = parseUnary();
        base = Math.pow(base, exp);
      }
      return base;
    }
    function parsePostfix(){
      let val = parsePrimary();
      while(isOp('!')){ next(); val = calcFactorial(val); }
      return val;
    }
    function parsePrimary(){
      const t = peek();
      if(!t) throw new Error('unexpected end');
      if(t.type === 'num'){ next(); return t.value; }
      if(t.type === 'op' && t.value === '('){
        next();
        const v = parseExpr();
        if(isOp(')')){ next(); } else { throw new Error('missing closing parenthesis'); }
        return v;
      }
      if(t.type === 'ident'){
        next();
        const name = t.value;
        if(name in CALC_CONSTANTS) return CALC_CONSTANTS[name];
        if(CALC_FUNCS_1ARG.includes(name)){
          let arg;
          if(isOp('(')){ next(); arg = parseExpr(); if(isOp(')')) next(); else throw new Error('missing closing parenthesis'); }
          else { arg = parseUnary(); }
          return calcApplyFunc(name, arg);
        }
        throw new Error('unknown identifier ' + name);
      }
      throw new Error('unexpected token');
    }

    const result = parseExpr();
    if(pos !== tokens.length){
      throw new Error('unexpected trailing tokens');
    }
    return result;
  }

  function formatCalcNumber(n){
    if(!Number.isFinite(n)) return 'Error';
    if(Object.is(n, -0)) n = 0;
    // Exact integers within the range doubles can represent precisely
    // should be shown exactly — rounding them to 12 significant figures
    // (as below) turns correct results like 999999999999×999 into an
    // approximation. Only apply the rounding to non-integer results,
    // where it's needed to hide floating-point noise (e.g. 0.1+0.2).
    if(Number.isInteger(n) && Number.isSafeInteger(n)){
      return n.toString();
    }
    let s = Number(n.toPrecision(12)).toString();
    if(s.replace('-','').replace('.','').length > 13){
      s = n.toExponential(6);
    }
    return s;
  }

  function calcTryEvaluate(str){
    if(!str) return null;
    try{
      const normalized = str.replace(/π/g, 'pi').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      const tokens = calcTokenize(normalized);
      if(!tokens.length) return null;
      const value = calcParse(tokens);
      if(!Number.isFinite(value)) return NaN;
      return value;
    }catch(e){ return null; }
  }

  let calcDegMode = true;
  let calcExpr = '';
  let calcJustEvaluated = false;
  const CALC_HISTORY_KEY = 'pomodoro.calcHistory.v1';
  let calcHistoryData = [];
  function calcSaveHistory(){
    try{ localStorage.setItem(CALC_HISTORY_KEY, JSON.stringify({ v: 1, items: calcHistoryData })); }catch(e){ }
  }
  (function loadCalcHistory(){
    try{
      const o = JSON.parse(localStorage.getItem(CALC_HISTORY_KEY));
      if(o && o.v === 1 && Array.isArray(o.items)){
        calcHistoryData = o.items.filter(x => x && typeof x.expr === 'string' && typeof x.result === 'string'
          && x.expr.length < 200 && x.result.length < 40).slice(0, 20)
          .map(x => ({ expr: x.expr, result: x.result, mode: (x.mode === 'DEG' || x.mode === 'RAD') ? x.mode : null }));
      }
    }catch(e){ calcHistoryData = []; }
  })();

  const calcExprEl    = document.getElementById('calcExpr');
  const calcAcBtn      = document.getElementById('calcAcBtn');
  const calcResultEl  = document.getElementById('calcResult');
  const calcResultInner = document.getElementById('calcResultInner');
  const calcDegToggle = document.getElementById('calcDegToggle');
  const calcKeypadEl  = document.getElementById('calcKeypad');
  const calcFxGrid     = document.getElementById('calcFxGrid');
  const calcSignBtn   = document.getElementById('calcSignBtn');

  const CALC_RESULT_BASE_PX = 54;
  const CALC_RESULT_MIN_PX = 20;

  let calcResultOverflow = 0;
  let calcResultPan = 0;
  let calcResultHadOverflow = false;

  function calcResultClampPan(v){
    return Math.min(calcResultOverflow, Math.max(0, v));
  }

  function calcResultUpdateMask(){
    const el = calcResultEl;
    if(calcResultOverflow <= 0.5){
      el.style.webkitMaskImage = 'none';
      el.style.maskImage = 'none';
      el.classList.remove('has-overflow');
      return;
    }
    el.classList.add('has-overflow');
    const leftFade = calcResultPan < calcResultOverflow - 0.5;
    const rightFade = calcResultPan > 0.5;
    const stops = [];
    stops.push(leftFade ? 'transparent 0' : 'black 0');
    stops.push(leftFade ? 'black 18px' : 'black 0');
    stops.push(rightFade ? 'black calc(100% - 18px)' : 'black 100%');
    stops.push(rightFade ? 'transparent 100%' : 'black 100%');
    const grad = `linear-gradient(to right, ${stops.join(', ')})`;
    el.style.webkitMaskImage = grad;
    el.style.maskImage = grad;
  }

  function calcResultSetPan(v, animate){
    calcResultPan = calcResultClampPan(v);
    calcResultInner.style.transition = animate ? 'transform .3s cubic-bezier(.22,1,.36,1)' : 'none';
    calcResultInner.style.transform = `translateX(${calcResultPan}px)`;
    calcResultUpdateMask();
  }

  function calcResultTeasePan(){
    if(calcResultOverflow <= 0) return;
    calcResultInner.style.transition = 'transform .22s ease-out';
    calcResultInner.style.transform = 'translateX(-7px)';
    setTimeout(() => {
      calcResultInner.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1)';
      calcResultInner.style.transform = `translateX(${calcResultPan}px)`;
    }, 170);
  }

  function fitCalcResultText(){
    const el = calcResultEl;
    const inner = calcResultInner;
    let size = CALC_RESULT_BASE_PX;
    inner.style.transition = 'none';
    inner.style.transform = 'translateX(0px)';
    el.style.fontSize = '';
    const computedBase = parseFloat(getComputedStyle(el).fontSize);
    if(computedBase) size = computedBase;
    el.style.fontSize = size + 'px';
    while(inner.scrollWidth > el.clientWidth && size > CALC_RESULT_MIN_PX){
      size -= 1;
      el.style.fontSize = size + 'px';
    }
    const wasOverflowing = calcResultOverflow > 0;
    calcResultOverflow = Math.max(0, inner.scrollWidth - el.clientWidth);
    calcResultSetPan(0, false);
    if(calcResultOverflow > 0 && !wasOverflowing){
      calcResultTeasePan();
    }
  }

  function setCalcResultText(text){
    calcResultInner.textContent = text;
    fitCalcResultText();
  }

  let calcResultDrag = null;

  function calcResultDragStart(x){
    if(calcResultOverflow <= 0) return false;
    calcResultDrag = { startX: x, startPan: calcResultPan };
    calcResultInner.style.transition = 'none';
    return true;
  }
  function calcResultDragMove(x){
    if(!calcResultDrag) return;
    const dx = x - calcResultDrag.startX;
    calcResultSetPan(calcResultDrag.startPan + dx, false);
  }
  function calcResultDragEnd(){
    if(!calcResultDrag) return;
    calcResultDrag = null;
    calcResultInner.style.transition = '';
  }

  calcResultEl.addEventListener('touchstart', (e) => {
    if(!calcResultDragStart(e.touches[0].clientX)) return;
    e.stopPropagation();
  }, { passive: true });
  calcResultEl.addEventListener('touchmove', (e) => {
    if(!calcResultDrag) return;
    e.stopPropagation();
    e.preventDefault();
    calcResultDragMove(e.touches[0].clientX);
  }, { passive: false });
  calcResultEl.addEventListener('touchend', (e) => { if(calcResultDrag){ e.stopPropagation(); } calcResultDragEnd(); });
  calcResultEl.addEventListener('touchcancel', (e) => { if(calcResultDrag){ e.stopPropagation(); } calcResultDragEnd(); });
  calcResultEl.addEventListener('mousedown', (e) => {
    if(!calcResultDragStart(e.clientX)) return;
    e.stopPropagation();
  });
  window.addEventListener('mousemove', (e) => { if(calcResultDrag) calcResultDragMove(e.clientX); });
  window.addEventListener('mouseup', () => { if(calcResultDrag) calcResultDragEnd(); });

  function calcRenderDisplay(){
    setCalcResultText(calcExpr || '0');
    updateAcLabel();
  }

  function updateAcLabel(){
    const showC = calcExpr.length > 0 && !calcJustEvaluated;
    calcAcBtn.textContent = showC ? 'C' : 'AC';
  }

  function calcClearExprLine(){
    calcExprEl.textContent = '';
  }

  function calcClear(){
    calcExpr = '';
    calcJustEvaluated = false;
    calcClearExprLine();
    calcResultEl.style.fontSize = '';
    setCalcResultText('0');
    updateAcLabel();
  }

  function calcTrailingNumberHasDot(str){
    let j = str.length;
    while(j > 0 && /[0-9.]/.test(str[j - 1])) j--;
    return str.slice(j).includes('.');
  }

  const CALC_BINARY_OPS = ['+','−','×','÷','^'];

  function calcInsert(str){
    calcClearExprLine();
    if(str === ')'){
      const base = calcIsError() ? '' : (calcJustEvaluated ? '' : calcExpr);
      if((base.match(/\(/g) || []).length <= (base.match(/\)/g) || []).length) return;
    }
    const isOperatorToken = ['+','−','×','÷','^','!'].includes(str);
    if(calcJustEvaluated){
      if(calcResultInner.textContent === 'Error'){
        calcExpr = (isOperatorToken && str !== '!') ? '0' + str : (str === '.' ? '0.' : (isOperatorToken ? '' : str));
      } else if(isOperatorToken){
        calcExpr = calcResultInner.textContent + str;
      } else if(str === '.'){
        calcExpr = '0.';
      } else {
        calcExpr = str;
      }
      calcJustEvaluated = false;
    } else if(CALC_BINARY_OPS.includes(str) && calcExpr && CALC_BINARY_OPS.includes(calcExpr[calcExpr.length - 1])){
      calcExpr = calcExpr.slice(0, -1) + str;
    } else if(str === '.' && calcTrailingNumberHasDot(calcExpr)){
      // Ignore a second decimal point within the same number
    } else if(!calcExpr && CALC_BINARY_OPS.includes(str) && str !== '−'){
      // Nothing typed yet — treat this as operating on the "0" that's
      // already showing (e.g. "+" → "0+"), instead of starting the
      // expression with a bare operator, which breaks evaluation. A
      // leading "−" is left alone since that's how a negative number
      // is typed.
      calcExpr = '0' + str;
    } else {
      calcExpr += str;
    }
    calcRenderDisplay();
  }

  function calcBackspace(){
    calcClearExprLine();
    if(calcJustEvaluated){ calcClear(); return; }
    calcExpr = calcExpr.slice(0, -1);
    calcRenderDisplay();
  }

  const CALC_NUM_TAIL = /(\d+\.?\d*|\.\d+)([eE][+\-−]?\d+)?$/;
  const calcIsError = () => calcJustEvaluated && calcResultInner.textContent === 'Error';

  // Start index of the trailing operand: number (incl. exponent), π/e,
  // "(...)" or "fn(...)", each optionally followed by "!". Returns
  // str.length when there is none.
  function calcFindTrailingOperandStart(str){
    const end = str.length;
    let i = end;
    while(i > 0 && str[i-1] === '!') i--;
    if(i === 0) return end;
    const c = str[i-1];
    if(c === ')'){
      let depth = 0, j = i - 1;
      for(; j >= 0; j--){
        if(str[j] === ')') depth++;
        else if(str[j] === '('){ depth--; if(depth === 0) break; }
      }
      if(j < 0) return end;
      let k = j;
      while(k > 0 && /[a-zA-Z]/.test(str[k-1])) k--;
      return CALC_FUNCS_1ARG.includes(str.slice(k, j).toLowerCase()) ? k : j;
    }
    if(c === 'π') return i - 1;
    const m = str.slice(0, i).match(CALC_NUM_TAIL);
    if(m) return i - m[0].length;
    if(c === 'e') return i - 1;
    return end;
  }

  // Pure helpers (testable): return the new expression, or null if not applicable.
  function calcSignExpr(expr){
    const s = calcFindTrailingOperandStart(expr);
    if(s >= expr.length) return null;
    const op = expr.slice(s), before = expr.slice(0, s);
    if(op.startsWith('(−') && op.endsWith(')')){
      let d = 0, whole = true;
      for(let k = 0; k < op.length; k++){
        if(op[k] === '(') d++; else if(op[k] === ')'){ d--; if(d === 0 && k < op.length - 1){ whole = false; break; } }
      }
      if(whole) return before + op.slice(2, -1);
    }
    return before + '(−' + op + ')';
  }

  // Percent: after + / − it is a percentage OF the left-hand value
  // (200+10% → 200+20); otherwise (×, ÷, alone) it is simply value/100.
  function calcPercentExpr(expr){
    const s = calcFindTrailingOperandStart(expr);
    if(s >= expr.length) return null;
    const v = calcTryEvaluate(expr.slice(s));
    if(v === null || Number.isNaN(v)) return null;
    const before = expr.slice(0, s);
    let val = v / 100;
    if(/[+\-−]$/.test(before)){
      const base = calcTryEvaluate(before.slice(0, -1));
      if(base !== null && !Number.isNaN(base)) val = base * v / 100;
    }
    return Number.isFinite(val) ? before + formatCalcNumber(val) : null;
  }

  function calcWrapExpr(expr, suffix){
    const s = calcFindTrailingOperandStart(expr);
    if(s >= expr.length) return null;
    return expr.slice(0, s) + '(' + expr.slice(s) + ')' + suffix;
  }

  // Shared by sign / percent / unary keys: operate on the shown result if
  // there is one, ignore everything while "Error" is showing.
  function calcApplyToOperand(fn){
    calcClearExprLine();
    if(calcIsError()) return;
    let expr = calcExpr;
    if(calcJustEvaluated) expr = calcResultInner.textContent;
    if(!expr) return;
    const out = fn(expr);
    if(out === null) return;
    calcExpr = out;
    calcJustEvaluated = false;
    calcRenderDisplay();
  }

  function calcPercent(){ calcApplyToOperand(calcPercentExpr); }
  function calcToggleSign(){ calcApplyToOperand(calcSignExpr); }
  function calcInsertUnaryOp(suffix){ calcApplyToOperand(e => calcWrapExpr(e, suffix)); }

  function calcClearEntry(){
    if(calcJustEvaluated || !calcExpr){ calcClear(); return; }
    const start = calcFindTrailingOperandStart(calcExpr);
    if(start >= calcExpr.length){
      calcClear();
      return;
    }
    calcClearExprLine();
    calcExpr = calcExpr.slice(0, start);
    calcRenderDisplay();
  }

  function calcEquals(){
    if(!calcExpr) return;
    const lastChar = calcExpr[calcExpr.length - 1];
    if(CALC_BINARY_OPS.includes(lastChar)){
      // Expression ends in an operator with no second operand — rather
      // than guessing (e.g. silently repeating the first number), do
      // nothing and let the person keep typing.
      return;
    }
    const v = calcTryEvaluate(calcExpr);
    if(v === null || Number.isNaN(v)){
      calcExprEl.textContent = calcExpr + ' =';
      setCalcResultText('Error');
      calcExpr = '';
      calcJustEvaluated = true;
      updateAcLabel();
      return;
    }
    const formatted = formatCalcNumber(v);
    calcExprEl.textContent = calcExpr + ' =';
    setCalcResultText(formatted);
    calcJustEvaluated = true;
    updateAcLabel();
    const histMode = calcDegMode ? 'DEG' : 'RAD';
    const isDuplicate = calcHistoryData.some(item => item.expr === calcExpr && item.result === formatted && (item.mode === histMode || item.mode === null));
    if(!isDuplicate){
      calcHistoryData.unshift({ expr: calcExpr, result: formatted, mode: histMode });
      if(calcHistoryData.length > 20) calcHistoryData.length = 20;
      calcSaveHistory();
    }
  }

  calcKeypadEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.calc-key');
    if(!btn) return;
    if(btn === calcSignBtn){ calcToggleSign(); return; }
    if(btn.dataset.action === 'ac'){
      if(calcExpr.length > 0 && !calcJustEvaluated){ calcClearEntry(); } else { calcClear(); }
      return;
    }
    if(btn.dataset.action === 'back'){ calcBackspace(); return; }
    if(btn.dataset.action === 'pct'){ calcPercent(); return; }
    if(btn.dataset.action === 'eq'){ calcEquals(); return; }
    if(btn.dataset.insert !== undefined) calcInsert(btn.dataset.insert);
  });

  const CALC_UNARY_WRAP_FNS = ['^2', '^-1', '!'];

  calcFxGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.calc-fx-key');
    if(!btn) return;
    if(btn === calcDegToggle){ return; }
    const fn = btn.dataset.fn;
    if(CALC_UNARY_WRAP_FNS.includes(fn)){
      calcInsertUnaryOp(fn);
      return;
    }
    if(fn === '^'){
      calcInsert('^');
      return;
    }
    calcInsert(fn);
  });

  const CALC_DEG_FADE_MS = 110;

  calcDegToggle.addEventListener('click', () => {
    // Swap the label with a quick fade-out/fade-in instead of an instant
    // textContent change, so the old and new glyph never flash together.
    calcDegToggle.style.transition = `color ${CALC_DEG_FADE_MS}ms ease`;
    calcDegToggle.style.color = 'transparent';
    setTimeout(() => {
      calcDegMode = !calcDegMode;
      calcDegToggle.textContent = calcDegMode ? 'DEG' : 'RAD';
      void calcDegToggle.offsetWidth;
      calcDegToggle.style.color = '';
      if(calcJustEvaluated && calcExpr){
        const v = calcTryEvaluate(calcExpr);
        if(v !== null && !Number.isNaN(v)){
          setCalcResultText(formatCalcNumber(v));
        }
      }
    }, CALC_DEG_FADE_MS);
  });

  calcClear();

  /* ---- Scientific toggle icon: reveals the fx grid above the basic grid.

     Why it stuttered on close (root cause):
     calc-fx-section's flex-basis was being CSS-transitioned, and since the
     basic grid below it (#calcKeypad) is flex:1, every single frame of that
     transition changed how much space the basic grid had — forcing the
     browser to re-run CSS Grid track sizing on its 4x6 grid AND repaint
     whatever newly-revealed cells that produced, on every frame. Growing
     (close = fx-section shrinks = basic grid grows back) is the expensive
     direction because it means painting freshly-revealed pixels every
     frame, not just clipping — hence the stutter showing up specifically
     on close.

     Fix: never animate flex-basis at all. Jump calc-fx-section and the
     basic grid straight to their FINAL sizes in one shot (a single
     layout+paint), then FLIP the basic grid — instantly place it back at
     its starting size/position with a transform — and let a transform-only
     transition (translateY + scaleY, GPU-composited, no layout, no
     per-frame repaint) carry it the rest of the way. calc-fx-section itself
     just crossfades via opacity. Visually this still reads as the two
     areas continuously growing/shrinking together. ---- */

  const calcFxToggle    = document.getElementById('calcFxToggle');
  const calcFxSection   = document.getElementById('calcFxSection');
  const calcFxInner     = document.getElementById('calcFxInner');
  const calcKeypadArea  = document.getElementById('calcKeypadArea');
  let calcFxExpanded = false;
  let calcFxAnimating = false;
  let calcTextRevealCleanupId = null;

  const CALC_FX_DURATION = 760; // ms — keep in sync with the transform transition set below, and with the opacity transition on .calc-fx-section

  function calcFxTargetHeight(){
    const totalH = calcKeypadArea.clientHeight;
    const cs = getComputedStyle(calcKeypadArea);
    const gapPx = parseFloat(cs.rowGap || cs.gap) || 0;
    const available = Math.max(0, totalH - gapPx);
    return Math.round(available / 3);
  }

  function setCalcFxExpanded(v){
    if(calcFxAnimating || v === calcFxExpanded) return;
    calcFxAnimating = true;
    calcFxToggle.classList.toggle('active', v);
    calcDegToggle.hidden = !v;

    // Hide the key glyphs immediately so they don't visibly stretch/
    // squash while the grid resizes; they're revealed (with a soft fade)
    // once the resize settles, in finishCalcFx() below.
    calcKeypadArea.classList.remove('calc-text-reveal');
    calcKeypadArea.classList.add('calc-text-veil');
    // Force the transparent-glyph style to be committed to the next paint
    // before we snapshot/animate the grid, so there's no frame where the
    // glyphs are still visible while the resize kicks off.
    void calcKeypadArea.offsetHeight;

    const gridFirst = calcKeypadEl.getBoundingClientRect();

    function flipGridFromFirst(){
      const gridLast = calcKeypadEl.getBoundingClientRect();
      const dy = gridFirst.top - gridLast.top;
      const sy = gridLast.height ? gridFirst.height / gridLast.height : 1;
      calcKeypadEl.style.transition = 'none';
      calcKeypadEl.style.transformOrigin = '50% 0%';
      calcKeypadEl.style.transform = `translateY(${dy}px) scaleY(${sy})`;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          calcKeypadEl.style.transition = `transform ${CALC_FX_DURATION}ms cubic-bezier(.45,0,.15,1)`;
          calcKeypadEl.style.transform = '';
          calcFxSection.style.opacity = v ? '1' : '0';
        });
      });
    }

    let calcFxFinished = false;
    const finishCalcFx = (e) => {
      if(e){
        if(e.target !== calcKeypadEl) return;
        if(e.propertyName && e.propertyName !== 'transform') return;
      }
      if(calcFxFinished) return;
      calcFxFinished = true;
      calcKeypadEl.removeEventListener('transitionend', finishCalcFx);
      clearTimeout(calcFxFallbackId);
      calcFxExpanded = v;
      calcFxAnimating = false;
      calcFxSection.style.willChange = 'auto';
      calcKeypadEl.style.willChange = 'auto';
      calcKeypadEl.style.transition = '';
      calcKeypadEl.style.transform = '';

      // Resize has settled at its final size — reveal the glyphs now,
      // fading them in softly rather than snapping them into view.
      calcKeypadArea.classList.remove('calc-text-veil');
      calcKeypadArea.classList.add('calc-text-reveal');
      clearTimeout(calcTextRevealCleanupId);
      calcTextRevealCleanupId = setTimeout(() => {
        calcKeypadArea.classList.remove('calc-text-reveal');
      }, 480);
    };
    const calcFxFallbackId = setTimeout(finishCalcFx, CALC_FX_DURATION + 120);

    calcFxSection.style.willChange = 'opacity';
    calcKeypadEl.style.willChange = 'transform';

    if(v){
      calcFxSection.hidden = false;
      calcFxSection.style.transition = 'none';
      calcFxSection.style.opacity = '0';
      const targetHeight = calcFxTargetHeight();
      calcFxInner.style.height = targetHeight + 'px';
      calcFxSection.style.flexBasis = targetHeight + 'px';
      flipGridFromFirst();
      calcFxSection.style.transition = '';
    } else {
      // Hide (display:none) *before* flipGridFromFirst() measures gridLast
      // below, not after the transition finishes. calcFxSection still
      // counts as a flex sibling of calcKeypadEl as long as it's merely
      // flex-basis:0 (not actually hidden), and .calc-keypad-area's `gap`
      // is still reserved between two present flex items regardless of
      // their size. So previously, gridLast (and the whole FLIP transform)
      // was computed as if that gap still existed, the transition ran to
      // match it — and only once the transition finished did `hidden` get
      // set, instantly collapsing that now-unclaimed gap and snapping the
      // grid up by a few pixels. That extra, non-animated snap right after
      // the transition ended was the stutter on close. Hiding it here means
      // the FLIP measurement already reflects the true final (gap-free)
      // layout, so the transition lands exactly on it with nothing left to
      // snap afterward.
      calcFxSection.style.transition = 'none';
      calcFxSection.style.flexBasis = '0px';
      calcFxSection.hidden = true;
      flipGridFromFirst();
      calcFxSection.style.transition = '';
    }

    calcKeypadEl.addEventListener('transitionend', finishCalcFx);
  }

  calcFxToggle.addEventListener('click', () => { setCalcFxExpanded(!calcFxExpanded); calcFxToggle.blur(); });

  /* ---- History (opens as a modal, same treatment as the Custom Loop editor) ---- */

  const calcHistoryBtn  = document.getElementById('calcHistoryBtn');
  const historyModal    = document.getElementById('historyModal');
  const historyList     = document.getElementById('historyList');
  const historyCloseBtn = document.getElementById('historyCloseBtn');

  function renderHistoryList(){
    historyList.innerHTML = '';
    if(calcHistoryData.length === 0){
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = 'No calculations yet';
      historyList.appendChild(empty);
      return;
    }
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:center;gap:12px;padding:4px 0 10px';
    const mk = (label, fn) => { const b = document.createElement('button'); b.className = 'reset-link'; b.textContent = label; b.addEventListener('click', () => fn(b)); bar.appendChild(b); };
    mk('Copy result', b => calcCopyResult(b));
    mk('Clear all', () => { calcHistoryData = []; calcSaveHistory(); renderHistoryList(); });
    historyList.appendChild(bar);
    calcHistoryData.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'history-item';

      const exprEl = document.createElement('div');
      exprEl.className = 'hx-expr';
      exprEl.textContent = item.expr + ' =';

      const resultEl = document.createElement('div');
      resultEl.className = 'hx-result';
      resultEl.textContent = item.result;

      btn.appendChild(exprEl);
      btn.appendChild(resultEl);
      btn.addEventListener('click', () => {
        if(item.mode){
          calcDegMode = (item.mode === 'DEG');
          calcDegToggle.textContent = item.mode;
        }
        calcExprEl.textContent = item.expr + ' =';
        setCalcResultText(item.result);
        calcExpr = item.expr;
        calcJustEvaluated = true;
        updateAcLabel();
        closeHistoryModal();
      });
      historyList.appendChild(btn);
    });
  }

  function calcCopyResult(label){
    const txt = calcResultInner.textContent;
    const flash = (m) => { if(!label) return; const old = label.textContent; label.textContent = m; setTimeout(() => { label.textContent = old; }, 1200); };
    if(txt === 'Error'){ flash('Nothing to copy'); return; }
    const fallback = () => {
      try{
        const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); flash(ok ? 'Copied' : 'Copy failed');
      }catch(e){ flash('Copy failed'); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => flash('Copied'), fallback);
    else fallback();
  }

  function openHistoryModal(){
    document.documentElement.classList.add('modal-locked');
    renderHistoryList();
    historyModal.hidden = false;
  }

  function closeHistoryModal(){
    historyModal.hidden = true;
    document.documentElement.classList.remove('modal-locked');
  }

  // Physical keyboard: only while the calculator page is showing and no modal is open.
  document.addEventListener('keydown', (e) => {
    if(appPageIndex !== 1 || e.altKey || e.metaKey) return;
    if(!historyModal.hidden){ if(e.key === 'Escape') closeHistoryModal(); return; }
    const tg = e.target;
    if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) return;
    const k = e.key;
    if(e.ctrlKey){ if(k === 'c' || k === 'C'){ calcCopyResult(null); e.preventDefault(); } return; }
    const map = { '*':'×', 'x':'×', 'X':'×', '/':'÷', '-':'−', '+':'+', '^':'^', '!':'!', '(':'(', ')':')', '.':'.', ',':'.', 'p':'π', 'e':'e' };
    if(/^[0-9]$/.test(k) || k in map) calcInsert(/^[0-9]$/.test(k) ? k : map[k]);
    else if(k === 'Enter' || k === '=') calcEquals();
    else if(k === 'Backspace') calcBackspace();
    else if(k === 'Escape') calcClear();
    else if(k === '%') calcPercent();
    else return;
    e.preventDefault();
  });

  calcHistoryBtn.addEventListener('click', openHistoryModal);
  historyCloseBtn.addEventListener('click', closeHistoryModal);
  historyModal.addEventListener('click', (e) => { if(e.target === historyModal) closeHistoryModal(); });
  historyModal.addEventListener('touchmove', (e) => { if(e.target === historyModal) e.preventDefault(); }, { passive: false });

  /* =====================================================================
     App-level paging — Timer page <-> Calculator page
     Same swipe physics as the dial preset track above.
     ===================================================================== */

  const appViewport = document.getElementById('appViewport');
  const appTrack     = document.getElementById('appTrack');
  const appPages     = [...appTrack.querySelectorAll('.app-page')];
  let appPageIndex = 0;
  let appVw = 0;

  function measureApp(){ appVw = appViewport.clientWidth; }
  measureApp();

  function appBaseX(){ return -appPageIndex * appVw; }

  function appUpdatePageVisuals(trackX){
    if(!appVw) return;
    appPages.forEach((page, idx) => {
      const t = idx + trackX / appVw;
      const c = Math.min(1, Math.abs(t));
      page.style.opacity = 1 - 0.55 * c;
    });
  }

  appTrack.style.transform = `translateX(${appBaseX()}px)`;
  appUpdatePageVisuals(appBaseX());

  function handleAppResize(){
    measureApp();
    appTrack.style.transform = `translateX(${appBaseX()}px)`;
    appUpdatePageVisuals(appBaseX());
    if(calcFxExpanded && !calcFxAnimating){
      const h = calcFxTargetHeight();
      calcFxInner.style.height = h + 'px';
      calcFxSection.style.transition = 'none';
      calcFxSection.style.flexBasis = h + 'px';
      void calcFxSection.offsetHeight;
      calcFxSection.style.transition = '';
    }
    fitCalcResultText();
  }
  window.addEventListener('resize', handleAppResize);
  window.addEventListener('orientationchange', () => setTimeout(handleAppResize, 50));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', handleAppResize);
  }

  let appSettleId = null;
  function appCancelSettle(){ if(appSettleId !== null){ cancelAnimationFrame(appSettleId); appSettleId = null; } }

  function appSettle(fromPx, toPx){
    appCancelSettle();
    if(toPx === fromPx){
      appTrack.style.transform = `translateX(${toPx}px)`;
      appUpdatePageVisuals(toPx);
      return;
    }
    const duration = 560;
    const startTime = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    function step(now){
      const t = Math.min(1, (now - startTime) / duration);
      const x = fromPx + (toPx - fromPx) * ease(t);
      appTrack.style.transform = `translateX(${x}px)`;
      appUpdatePageVisuals(x);
      if(t < 1){
        appSettleId = requestAnimationFrame(step);
      } else {
        appSettleId = null;
      }
    }
    appSettleId = requestAnimationFrame(step);
  }

  const APP_TRACK_EXCLUDE = '#viewport, .time-unit, .time-colon, .modal-overlay, input, .calc-mode-toggle, .calc-icon-btn, .history-item, .dial-btn, .reset-link, .tab, .lofi-btn, .lofi-shuffle';

  let appDragStartX = null, appDragStartY = null, appDragging = false, appDragDelta = 0, appDragDecided = false, appDragHorizontal = false;

  function appOnDragStart(x, y){
    appCancelSettle();
    appTrack.style.transform = `translateX(${appBaseX()}px)`;
    appDragStartX = x; appDragStartY = y;
    appDragging = true; appDragDelta = 0;
    appDragDecided = false; appDragHorizontal = false;
  }

  function appOnDragMove(x, y){
    if(!appDragging) return;
    const dx = x - appDragStartX;
    const dy = y - appDragStartY;
    if(!appDragDecided){
      if(Math.abs(dx) > 10 || Math.abs(dy) > 10){
        appDragDecided = true;
        appDragHorizontal = Math.abs(dx) > Math.abs(dy);
        if(!appDragHorizontal){ appDragging = false; return; }
      } else {
        return;
      }
    }
    let ddx = dx;
    const atLeftEdge = appPageIndex === 0 && ddx > 0;
    const atRightEdge = appPageIndex === appPages.length - 1 && ddx < 0;
    if(atLeftEdge || atRightEdge) ddx = 0;
    appDragDelta = ddx;
    const x2 = appBaseX() + ddx;
    appTrack.style.transform = `translateX(${x2}px)`;
    appUpdatePageVisuals(x2);
  }

  function appOnDragEnd(){
    if(!appDragging) return;
    appDragging = false;
    if(!appDragDecided || !appDragHorizontal) return;
    const dx = appDragDelta;
    const threshold = appVw * 0.22;
    const oldIndex = appPageIndex;
    let target = oldIndex;
    if(dx <= -threshold && oldIndex < appPages.length - 1) target = oldIndex + 1;
    else if(dx >= threshold && oldIndex > 0) target = oldIndex - 1;
    const fromPx = -oldIndex * appVw + dx;
    appPageIndex = target;
    appSettle(fromPx, appBaseX());
  }

  document.addEventListener('touchstart', (e) => {
    if(customModal && !customModal.hidden) return;
    if(e.target.closest(APP_TRACK_EXCLUDE)) return;
    const t = e.touches[0];
    appOnDragStart(t.clientX, t.clientY);
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if(!appDragging) return;
    const t = e.touches[0];
    appOnDragMove(t.clientX, t.clientY);
    if(appDragDecided && appDragHorizontal) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', () => { appOnDragEnd(); });
  function appOnDragCancel(){
    const wasDragging = appDragging;
    const fromPx = appBaseX() + appDragDelta;
    appDragging = false;
    appDragDelta = 0;
    appDragDecided = false;
    appDragHorizontal = false;
    appDragStartX = null; appDragStartY = null;
    if(wasDragging) appSettle(fromPx, appBaseX());
  }
  document.addEventListener('touchcancel', appOnDragCancel);

  // Main pages never scroll vertically; undo any programmatic/focus scroll.
  appPages.forEach(pg => pg.addEventListener('scroll', () => { if(pg.scrollTop) pg.scrollTop = 0; }, { passive: true }));

  document.addEventListener('mousedown', (e) => {
    if(customModal && !customModal.hidden) return;
    if(e.target.closest(APP_TRACK_EXCLUDE)) return;
    appOnDragStart(e.clientX, e.clientY);
    appDragDecided = true;
    appDragHorizontal = true;
  });
  document.addEventListener('mousemove', (e) => { if(appDragging) appOnDragMove(e.clientX, e.clientY); });
  document.addEventListener('mouseup', () => { appOnDragEnd(); });
  /* =====================================================================
     Settings screen
     ===================================================================== */
  const settingsModal    = document.getElementById('settingsModal');
  const presetsModal     = document.getElementById('presetsModal');
  const setSoundBtn      = document.getElementById('setSound');
  const setSoundVal      = document.getElementById('setSoundVal');
  const setVolumeRow     = document.getElementById('setVolumeRow');
  const setVolumeVal     = document.getElementById('setVolumeVal');
  const setBeepVal       = document.getElementById('setBeepVal');
  const setNotifyBtn     = document.getElementById('setNotify');
  const setNotifyVal     = document.getElementById('setNotifyVal');
  const swatchesEl       = document.getElementById('swatches');
  const setPresetsBtn    = document.getElementById('setPresets');
  const setClearCalcBtn  = document.getElementById('setClearCalc');
  const setClearCalcVal  = document.getElementById('setClearCalcVal');

  function setOnOff(el, on){
    el.textContent = on ? 'ON' : 'OFF';
    el.classList.toggle('off', !on);
  }

  function notifyState(){
    if(!('Notification' in window)) return 'N/A';
    if(Notification.permission === 'denied') return 'BLOCKED';
    return appSettings.notify ? 'ON' : 'OFF';
  }

  function refreshSettingsUI(){
    setOnOff(setSoundVal, appSettings.sound);
    refreshLofiUI();
    setVolumeRow.classList.toggle('dim', !appSettings.sound);
    const ns = notifyState();
    setNotifyVal.textContent = ns;
    setNotifyVal.classList.toggle('off', ns !== 'ON');
    swatchesEl.querySelectorAll('.swatch').forEach(sw => {
      sw.classList.toggle('active', sw.dataset.color === appSettings.bg);
    });
  }

  // Volume: same drag-up/down number control as the rest of the app (step 5).
  let volumePreviewTimer = null;
  let volumeReady = false;
  const volumeField = {
    value: appSettings.volume, lo: 0, hi: 100,
    paint(){
      setVolumeVal.textContent = String(this.value);
      if(!volumeReady) return;
      appSettings.volume = this.value;
      saveSettings();
    }
  };
  createDragUnit(setVolumeVal, volumeField, 5);
  volumeField.paint();
  volumeReady = true;

  setSoundBtn.addEventListener('click', () => {
    appSettings.sound = !appSettings.sound;
    saveSettings();
    refreshSettingsUI();
    if(appSettings.sound) playBeep();
  });

  // Beep: drag up/down to change the sound, tap to preview.
  // Backed by index*5 so the shared drag control steps one sound at a time.
  let beepPreviewTimer = null;
  let beepReady = false;
  const beepIndexOf = id => Math.max(0, BEEP_STYLES.findIndex(x => x.id === id));
  const beepField = {
    value: beepIndexOf(appSettings.beep) * 5, lo: 0, hi: (BEEP_STYLES.length - 1) * 5,
    wrap: true,
    paint(){
      const st = BEEP_STYLES[Math.round(this.value / 5)];
      setBeepVal.textContent = st.label;
      if(!beepReady) return;
      appSettings.beep = st.id;
      saveSettings();
      clearTimeout(beepPreviewTimer);
      beepPreviewTimer = setTimeout(() => playBeep(true), 350);
    },
    onTap(){ clearTimeout(beepPreviewTimer); playBeep(true); }
  };
  createDragUnit(setBeepVal, beepField, 5);
  beepField.paint();
  beepReady = true;

  /* ---------- lo-fi settings ---------- */
  const lofiBtn           = document.getElementById('lofiBtn');
  const lofiModal         = document.getElementById('lofiModal');
  const lofiVolWrap       = document.getElementById('lofiVolWrap');
  const setLofiShuffleBtn = document.getElementById('lofiShuffleBtn');
  const lofiSlider        = document.getElementById('lofiVolumeSlider');
  const setLofiTracksBtn  = document.getElementById('setLofiTracks');
  const setLofiTracksVal  = document.getElementById('setLofiTracksVal');
  const lofiFileInput     = document.getElementById('lofiFileInput');
  const lofiListEl        = document.getElementById('lofiList');
  /* ---------- lo-fi button: audio visualizer (vertical bars) ---------- */
  const lofiWavePath = lofiBtn.querySelector('.wave path');
  const lofiWaveIdle = lofiWavePath.getAttribute('d');
  const VIZ_BARS = 12, VIZ_X0 = 4, VIZ_DX = 56 / 11;
  const VIZ_MAX_HALF = 6;      // tallest bar = 6 units each way from the centre (the box allows 11)
  const vizBuf = new Uint8Array(256), vizAmp = new Float32Array(VIZ_BARS);
  // log-spaced bands over bins 1..96 of a 512-point FFT (about 100 Hz to 9 kHz)
  const vizEdges = Array.from({ length: VIZ_BARS + 1 }, (_, i) => Math.round(Math.pow(96, i / VIZ_BARS)));
  const vizReduce = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  let vizRaf = 0, vizOn = false;
  function vizFrame(){
    vizRaf = requestAnimationFrame(vizFrame);
    const an = lofi.analyser;
    if(!an) return;
    an.getByteFrequencyData(vizBuf);
    let d = '';
    for(let i = 0; i < VIZ_BARS; i++){
      const lo = vizEdges[i], hi = Math.max(lo + 1, vizEdges[i + 1]);
      let sum = 0;
      for(let k = lo; k < hi; k++) sum += vizBuf[k];
      // squared so quiet passages stay low; slight tilt so the high bands still move
      const target = Math.min(1, Math.pow(sum / (hi - lo) / 255, 2) * (1 + i * 0.08));
      vizAmp[i] += (target - vizAmp[i]) * (target > vizAmp[i] ? 0.4 : 0.12);   // fast attack, slow release
      const h = 1 + vizAmp[i] * (VIZ_MAX_HALF - 1);
      const x = (VIZ_X0 + i * VIZ_DX).toFixed(1);
      d += 'M' + x + ' ' + (12 - h).toFixed(1) + 'L' + x + ' ' + (12 + h).toFixed(1);
    }
    lofiWavePath.setAttribute('d', d);
  }
  function vizSync(){
    const want = !!(appSettings.lofi && lofi.analyser && !(vizReduce && vizReduce.matches));
    if(want && !vizOn){
      vizOn = true;
      vizAmp.fill(0);
      vizRaf = requestAnimationFrame(vizFrame);
    } else if(!want && vizOn){
      vizOn = false;
      cancelAnimationFrame(vizRaf);
      lofiWavePath.setAttribute('d', lofiWaveIdle);
    }
  }
  const LOFI_THUMB_SIZE = 36;   // must match .lofi-slider thumb size

  function updateLofiFill(){
    const r = (lofiSlider.value - lofiSlider.min) / (lofiSlider.max - lofiSlider.min);
    lofiSlider.style.setProperty('--fill', `calc(${r * 100}% + ${LOFI_THUMB_SIZE * (0.5 - r)}px)`);
  }
  function refreshLofiUI(){
    lofiBtn.classList.toggle('active', appSettings.lofi);
    vizSync();
    lofiBtn.setAttribute('aria-pressed', String(appSettings.lofi));
    lofiVolWrap.classList.toggle('disabled', !appSettings.lofi);
    setLofiShuffleBtn.classList.toggle('active', appSettings.lofiShuffle);
    setLofiShuffleBtn.setAttribute('aria-pressed', String(appSettings.lofiShuffle));
    lofiSlider.value = appSettings.lofiVolume;
    updateLofiFill();
    const n = lofi.tracks.length;
    setLofiTracksVal.textContent = '+';
    if(!n){
      const em = document.createElement('div');
      em.className = 'lofi-empty';
      em.textContent = 'No tracks yet';
      lofiListEl.replaceChildren(em);
      return;
    }
    lofiListEl.replaceChildren(...lofi.tracks.map(t => {
      const row = document.createElement('div');
      row.className = 'lofi-item';
      const name = document.createElement('span');
      name.textContent = t.name + (typeof t.id === 'string' ? ' (temp)' : '');
      const del = document.createElement('button');
      del.type = 'button';
      del.textContent = '\u00d7';
      del.setAttribute('aria-label', 'Remove ' + t.name);
      del.addEventListener('click', async () => {
        try{ await LofiDB.del(t.id); }catch(e){ }
        await lofi.reload();
        refreshLofiUI();
      });
      row.append(name, del);
      return row;
    }));
  }

  // Playback state is per session: browsers block autoplay on load.
  appSettings.lofi = false;

  function setLofiOn(on){
    appSettings.lofi = !!on;
    saveSettings();
    getAudioCtx();
    refreshLofiUI();
    lofi.sync();
    vizSync();
    lofi.refresh();
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = appSettings.lofi ? 'playing' : 'paused';
  }
  lofi.setStopHandler(() => {
    appSettings.lofi = false;
    saveSettings();
    refreshLofiUI();
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  });
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play', () => setLofiOn(true));
      navigator.mediaSession.setActionHandler('pause', () => setLofiOn(false));
      navigator.mediaSession.setActionHandler('nexttrack', () => lofi.next());
    }catch(e){ }
  }

  let lofiPressTimer = null, lofiLongFired = false, lofiPressX = 0, lofiPressY = 0, lofiOpenedAt = 0;
  function openLofiModal(){
    document.documentElement.classList.add('modal-locked');
    refreshLofiUI();
    lofiOpenedAt = Date.now();
    lofiModal.hidden = false;
    lofiModal.scrollTop = 0;
  }
  function closeLofiModal(){
    lofiModal.hidden = true;
    document.documentElement.classList.remove('modal-locked');
  }
  lofiBtn.addEventListener('pointerdown', (e) => {
    lofiLongFired = false;
    lofiPressX = e.clientX; lofiPressY = e.clientY;
    clearTimeout(lofiPressTimer);
    lofiPressTimer = setTimeout(() => {
      lofiLongFired = true;
      try{ if(navigator.vibrate) navigator.vibrate(10); }catch(err){ }
      openLofiModal();
    }, 500);
  });
  lofiBtn.addEventListener('pointermove', (e) => {
    if(Math.hypot(e.clientX - lofiPressX, e.clientY - lofiPressY) > 10) clearTimeout(lofiPressTimer);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => lofiBtn.addEventListener(t, () => clearTimeout(lofiPressTimer)));
  lofiBtn.addEventListener('contextmenu', (e) => e.preventDefault());
  lofiBtn.addEventListener('click', () => {
    if(lofiLongFired){ lofiLongFired = false; return; }
    setLofiOn(!appSettings.lofi);
  });
  document.getElementById('lofiCloseBtn').addEventListener('click', closeLofiModal);
  lofiModal.addEventListener('click', (e) => { if(e.target === lofiModal && Date.now() - lofiOpenedAt > 400) closeLofiModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && !lofiModal.hidden) closeLofiModal(); });
  setLofiShuffleBtn.addEventListener('click', async () => {
    appSettings.lofiShuffle = !appSettings.lofiShuffle;
    saveSettings();
    refreshLofiUI();
    await lofi.reload();
  });
  lofiSlider.addEventListener('input', () => {
    appSettings.lofiVolume = parseInt(lofiSlider.value, 10);
    saveSettings();
    updateLofiFill();
    lofi.refresh();
  });
  setLofiTracksBtn.addEventListener('click', () => lofiFileInput.click());
  const LOFI_MAX_FILE  = 20 * 1024 * 1024;     // per file
  const LOFI_MAX_TOTAL = 200 * 1024 * 1024;    // all tracks together
  const LOFI_MIME = { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav',
                      ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', flac: 'audio/flac' };
  lofiFileInput.addEventListener('change', async () => {
    const picked = [...lofiFileInput.files];
    let rejected = 0;
    let total = lofi.tracks.reduce((sum, t) => sum + (t.blob ? t.blob.size : 0), 0);
    for(const f of picked){
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      if(!/^audio\//.test(f.type) && !LOFI_MIME[ext]){ rejected++; continue; }
      if(f.size > LOFI_MAX_FILE || total + f.size > LOFI_MAX_TOTAL) continue;   // over the limits: skipped silently
      try{
        // Copy the bytes: a File picked from iCloud/Files can be lazy or fragile in IndexedDB on iOS.
        const type = /^audio\//.test(f.type) ? f.type : LOFI_MIME[ext];
        await LofiDB.add(f.name, new Blob([await f.arrayBuffer()], { type }));
        total += f.size;
      }catch(e){ rejected++; }
    }
    lofiFileInput.value = '';
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){ }
    await lofi.reload();
    refreshLofiUI();
    if(rejected){
      setLofiTracksVal.textContent = rejected + ' FAILED';
      setTimeout(refreshLofiUI, 2500);
    }
  });
  refreshLofiUI();
  lofi.reload().then(refreshLofiUI);

  setNotifyBtn.addEventListener('click', () => {
    const ns = notifyState();
    if(ns === 'N/A' || ns === 'BLOCKED') return;
    appSettings.notify = !appSettings.notify;
    saveSettings();
    refreshSettingsUI();
    if(appSettings.notify){
      try{
        if(Notification.permission === 'default'){
          const r = Notification.requestPermission(() => refreshSettingsUI());
          if(r && r.then) r.then(refreshSettingsUI, () => {});
        }
      }catch(e){ }
    }
  });

  BG_CHOICES.forEach(color => {
    const sw = document.createElement('button');
    sw.className = 'swatch';
    sw.dataset.color = color;
    sw.style.setProperty('--c', color);
    sw.setAttribute('aria-label', 'Background ' + color);
    sw.addEventListener('click', () => {
      appSettings.bg = color;
      saveSettings();
      applyBackground(color);
      refreshSettingsUI();
    });
    swatchesEl.appendChild(sw);
  });

  let clearCalcArmed = false, clearCalcTimer = null;
  function resetClearCalcBtn(){
    clearCalcArmed = false;
    clearTimeout(clearCalcTimer);
    setClearCalcVal.textContent = 'CLEAR';
    setClearCalcVal.classList.remove('off');
  }
  setClearCalcBtn.addEventListener('click', () => {
    if(!clearCalcArmed){
      clearCalcArmed = true;
      setClearCalcVal.textContent = 'TAP AGAIN';
      clearTimeout(clearCalcTimer);
      clearCalcTimer = setTimeout(resetClearCalcBtn, 2500);
      return;
    }
    clearTimeout(clearCalcTimer);
    calcHistoryData = [];
    calcSaveHistory();
    clearCalcArmed = false;
    setClearCalcVal.textContent = 'DONE';
    setClearCalcVal.classList.add('off');
    clearCalcTimer = setTimeout(resetClearCalcBtn, 1500);
  });

  function openSettingsModal(){
    document.documentElement.classList.add('modal-locked');
    resetClearCalcBtn();
    volumeField.value = appSettings.volume;
    volumeReady = false; volumeField.paint(); volumeReady = true;
    beepField.value = beepIndexOf(appSettings.beep) * 5;
    beepReady = false; beepField.paint(); beepReady = true;
    refreshSettingsUI();
    settingsModal.hidden = false;
    settingsModal.scrollTop = 0;
  }
  function closeSettingsModal(){
    settingsModal.hidden = true;
    clearTimeout(volumePreviewTimer);
    clearTimeout(beepPreviewTimer);
    document.documentElement.classList.remove('modal-locked');
  }
  document.getElementById('settingsCloseBtn').addEventListener('click', closeSettingsModal);
  settingsModal.addEventListener('click', (e) => { if(e.target === settingsModal) closeSettingsModal(); });

  /* ---------- preset editor (25/5 and 50/10) ---------- */
  const presetSwitchBtns = [...presetsModal.querySelectorAll('.preset-switch .reset-link')];
  const pWorkPicker  = createTimeField(document.getElementById('pWorkMin'),  document.getElementById('pWorkSec'),
                                       PRESETS[1].work, PRESET_TIME_MIN_WORK, PRESET_TIME_MAX);
  const pBreakPicker = createTimeField(document.getElementById('pBreakMin'), document.getElementById('pBreakSec'),
                                       PRESETS[1].brk,  PRESET_TIME_MIN_BREAK, PRESET_TIME_MAX);
  let presetDraft = null;      // { 1:{work,brk}, 2:{work,brk} }
  let presetDraftIdx = 1;

  function fmtShortMin(sec){
    return (sec % 60 === 0) ? String(sec / 60) : Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function tabLabelFor(work, brk){ return fmtShortMin(work) + ' / ' + fmtShortMin(brk); }

  function paintPresetSwitch(){
    presetSwitchBtns.forEach(b => {
      const i = +b.dataset.p;
      b.textContent = tabLabelFor(presetDraft[i].work, presetDraft[i].brk);
      b.classList.toggle('active', i === presetDraftIdx);
    });
  }
  function stashPresetDraft(){
    presetDraft[presetDraftIdx] = { work: pWorkPicker.getValue(), brk: pBreakPicker.getValue() };
  }
  function selectPresetDraft(i){
    stashPresetDraft();
    presetDraftIdx = i;
    pWorkPicker.setValue(presetDraft[i].work);
    pBreakPicker.setValue(presetDraft[i].brk);
    paintPresetSwitch();
  }
  presetSwitchBtns.forEach(b => b.addEventListener('click', () => selectPresetDraft(+b.dataset.p)));

  function openPresetsModal(){
    presetDraft = { 1: { work: PRESETS[1].work, brk: PRESETS[1].brk }, 2: { work: PRESETS[2].work, brk: PRESETS[2].brk } };
    presetDraftIdx = 1;
    pWorkPicker.setValue(presetDraft[1].work);
    pBreakPicker.setValue(presetDraft[1].brk);
    paintPresetSwitch();
    settingsModal.hidden = true;
    presetsModal.hidden = false;
  }
  function closePresetsModal(){
    presetsModal.hidden = true;
    settingsModal.hidden = false;
  }
  setPresetsBtn.addEventListener('click', openPresetsModal);
  document.getElementById('presetsCancelBtn').addEventListener('click', closePresetsModal);
  presetsModal.addEventListener('click', (e) => { if(e.target === presetsModal) closePresetsModal(); });
  presetsModal.addEventListener('touchmove', (e) => { if(e.target === presetsModal) e.preventDefault(); }, { passive: false });

  function refreshPresetTab(idx){
    const p = PRESETS[idx];
    const label = tabLabelFor(p.work, p.brk);
    tabs[idx].textContent = label;
    tabs[idx].style.fontSize = label.length > 9 ? '10px' : '';
  }

  document.getElementById('presetsApplyBtn').addEventListener('click', () => {
    stashPresetDraft();
    const saved = {};
    [1, 2].forEach(i => {
      const d = presetDraft[i];
      saved[i] = { work: d.work, brk: d.brk };
      if(PRESETS[i].work === d.work && PRESETS[i].brk === d.brk) return;   // untouched: keep a running timer running
      PRESETS[i].work = d.work;
      PRESETS[i].brk = d.brk;
      refreshPresetTab(i);
      cancelResetAnim(i);
      states[i] = makeState(i);
      render(i, states[i].remaining, true);
      if(presetIndex === i) updateControls();
    });
    try{ localStorage.setItem(PRESET_TIMES_KEY, JSON.stringify(saved)); }catch(e){ }
    closePresetsModal();
  });

  // Reflect stored preset times in the tab labels / dials on load.
  [1, 2].forEach(i => { refreshPresetTab(i); render(i, states[i].remaining, true); });

  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    if(!presetsModal.hidden) closePresetsModal();
    else if(!settingsModal.hidden) closeSettingsModal();
  });
</script>

</body>
</html>
